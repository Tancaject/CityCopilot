<div id="mq-outcomes-demo">
  <h3>同样的处理能力，业务结果有什么不同？</h3>
  <div class="viz-controls">
    <label class="form-label">场景
      <select class="form-select" id="mq-scene" aria-label="选择实验场景">
        <option value="0">餐券秒杀高峰</option>
        <option value="1">核销统计故障与恢复</option>
      </select>
    </label>
    <button type="button" class="btn btn-primary" id="mq-play">播放过程</button>
    <button type="button" class="btn" id="mq-step">下一事件</button>
  </div>
  <div id="mq-conditions" class="text-small text-muted"></div>
  <div class="mq-lanes">
    <section aria-labelledby="mq-direct-title">
      <h3 id="mq-direct-title">不用消息队列</h3>
      <div id="mq-direct-label" class="mq-label text-small"></div>
      <div id="mq-direct-jobs" class="mq-jobs" role="list" aria-label="同步方案每笔业务状态"></div>
      <div id="mq-direct-count" class="mq-count tabular-nums"></div>
    </section>
    <section aria-labelledby="mq-queued-title">
      <h3 id="mq-queued-title">使用排队与确认机制</h3>
      <div id="mq-queued-label" class="mq-label text-small"></div>
      <div id="mq-queued-jobs" class="mq-jobs" role="list" aria-label="排队方案每笔业务状态"></div>
      <div id="mq-queued-count" class="mq-count tabular-nums"></div>
    </section>
  </div>
  <div class="viz-row mq-legend text-small" aria-label="状态图例">
    <span><i class="mq-swatch mq-state-0"></i>等待</span>
    <span><i class="mq-swatch mq-state-1"></i>执行中</span>
    <span><i class="mq-swatch mq-state-2"></i>已完成</span>
    <span><i class="mq-swatch mq-state-3"></i>超时 / 统计失败</span>
  </div>
  <hr>
  <label class="form-label" for="mq-position">事件 <span id="mq-event-number" class="tabular-nums"></span> · 实际经过 <span id="mq-time" class="tabular-nums"></span> 秒
    <input type="range" class="form-range" id="mq-position" min="0" step="1" aria-label="查看实验事件">
  </label>
  <div id="mq-note" aria-live="polite" class="mq-note"></div>
  <div class="text-small text-muted">本机 Java 实验回放 · 逐事件放慢展示 · 模拟数据库与服务故障，文件与 JVM 退出是真实操作</div>
  <script type="application/json" id="mq-trace">__TRACE_DATA__</script>
</div>
<style>
  #mq-outcomes-demo .mq-lanes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; margin:16px 0; }
  #mq-outcomes-demo .mq-label { min-height:3em; }
  #mq-outcomes-demo .mq-jobs { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; margin:12px 0; }
  #mq-outcomes-demo .mq-job { display:flex; align-items:center; justify-content:center; min-height:40px; color:var(--foreground); }
  #mq-outcomes-demo .mq-state-0 { background:color-mix(in srgb,var(--viz-series-1) 15%,transparent); }
  #mq-outcomes-demo .mq-state-1 { background:color-mix(in srgb,var(--viz-series-2) 35%,transparent); }
  #mq-outcomes-demo .mq-state-2 { background:color-mix(in srgb,var(--viz-series-3) 30%,transparent); }
  #mq-outcomes-demo .mq-state-3 { background:color-mix(in srgb,var(--viz-series-4) 35%,transparent); }
  #mq-outcomes-demo .mq-count { min-height:3em; }
  #mq-outcomes-demo .mq-legend > span { display:inline-flex; align-items:center; gap:6px; }
  #mq-outcomes-demo .mq-swatch { display:inline-block; width:14px; height:14px; }
  #mq-outcomes-demo .mq-note { min-height:3em; margin:12px 0; }
  @media(max-width:520px) { #mq-outcomes-demo .mq-lanes { grid-template-columns:1fr; gap:8px; } #mq-outcomes-demo .mq-label { min-height:0; } #mq-outcomes-demo .mq-count { min-height:0; } }
</style>
<script>
(() => {
  const root = document.getElementById('mq-outcomes-demo');
  const scenes = JSON.parse(root.querySelector('#mq-trace').textContent).scenes;
  const select = root.querySelector('#mq-scene');
  const play = root.querySelector('#mq-play');
  const step = root.querySelector('#mq-step');
  const position = root.querySelector('#mq-position');
  const names = ['等待', '执行中', '已完成', '失败'];
  let sceneIndex = 0;
  let index = scenes[0].frames.length - 1;
  let timer = null;

  function stop() {
    clearTimeout(timer);
    timer = null;
    play.textContent = '播放过程';
  }

  function paint() {
    const scene = scenes[sceneIndex];
    const frame = scene.frames[index];
    root.querySelector('#mq-conditions').textContent = scene.conditions;
    root.querySelector('#mq-direct-label').textContent = scene.directLabel;
    root.querySelector('#mq-queued-label').textContent = scene.queuedLabel;
    for (const lane of ['direct', 'queued']) {
      const values = frame[lane];
      const jobs = root.querySelector('#mq-' + lane + '-jobs');
      jobs.replaceChildren(...values.map((value, id) => {
        const tile = document.createElement('span');
        tile.className = 'mq-job mq-state-' + value + ' tabular-nums';
        tile.textContent = String(id + 1).padStart(2, '0');
        tile.setAttribute('role', 'listitem');
        const state = value === 3 ? (sceneIndex === 0 ? '等连接超时，未下单' : '统计失败，核销已完成') : names[value];
        tile.setAttribute('aria-label', '业务 ' + (id + 1) + '：' + state);
        tile.setAttribute('data-tooltip', '业务 ' + (id + 1) + '：' + state);
        return tile;
      }));
      const count = state => values.filter(value => value === state).length;
      let text;
      if (sceneIndex === 0) {
        text = '完成 ' + count(2) + ' · 超时 ' + count(3) + ' · 等待 ' + count(0) + ' · 执行中 ' + count(1);
      } else {
        text = '核销 3 · 已统计 ' + count(2);
        text += lane === 'queued' ? ' · 待确认 ' + frame.pending + ' · 重复跳过 ' + frame.duplicates : ' · 更新失败 ' + count(3);
      }
      root.querySelector('#mq-' + lane + '-count').textContent = text;
    }
    position.max = scene.frames.length - 1;
    position.value = index;
    root.querySelector('#mq-event-number').textContent = (index + 1) + ' / ' + scene.frames.length;
    root.querySelector('#mq-time').textContent = (frame.ms / 1000).toFixed(2);
    root.querySelector('#mq-note').textContent = frame.note;
  }

  function advance() {
    index++;
    paint();
    if (index === scenes[sceneIndex].frames.length - 1) { stop(); return; }
    const frames = scenes[sceneIndex].frames;
    timer = setTimeout(advance, Math.max(250, Math.min(1200, frames[index + 1].ms - frames[index].ms)));
  }

  play.addEventListener('click', () => {
    if (timer !== null) { stop(); return; }
    if (index === scenes[sceneIndex].frames.length - 1) index = 0;
    paint();
    play.textContent = '暂停';
    timer = setTimeout(advance, 600);
  });
  step.addEventListener('click', () => {
    stop();
    index = (index + 1) % scenes[sceneIndex].frames.length;
    paint();
  });
  select.addEventListener('change', () => {
    stop();
    sceneIndex = Number(select.value);
    index = scenes[sceneIndex].frames.length - 1;
    paint();
  });
  position.addEventListener('input', () => { stop(); index = Number(position.value); paint(); });
  paint();
})();
</script>
