# Combine with compose.yaml under project citycopilot-redesign-load.
# Project-scoped volumes are independent from the default business deployment.
name: citycopilot-redesign-load

services:
  mysql:
    environment:
      MYSQL_DATABASE: citycopilot_core_load_test
    ports: !override ["127.0.0.1:13317:3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -u\"$${MYSQL_USER}\" -D\"$${MYSQL_DATABASE}\" -N -e 'SELECT 1' >/dev/null"]
  commerce-mysql:
    environment:
      MYSQL_DATABASE: citycopilot_commerce_load_test
    ports: !override ["127.0.0.1:13319:3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -u\"$${MYSQL_USER}\" -D\"$${MYSQL_DATABASE}\" -N -e 'SELECT 1' >/dev/null"]
  core-migrate:
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/citycopilot_core_load_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
  commerce-migrate:
    environment:
      FLYWAY_URL: jdbc:mysql://commerce-mysql:3306/citycopilot_commerce_load_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
  redis:
    ports: !override ["127.0.0.1:16389:6379"]
  rocketmq-namesrv:
    ports: !reset []
  rocketmq-broker:
    ports: !reset []
  rocketmq-proxy:
    ports: !reset []
  rocketmq-dashboard:
    ports: !reset []
  core:
    restart: "no"
    deploy:
      replicas: 2
    ports: !reset []
    environment:
      CITYCOPILOT_DB_URL: jdbc:mysql://mysql:3306/citycopilot_core_load_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
      CITYCOPILOT_COMMERCE_BASE_URL: http://frontend:8084
      CITYCOPILOT_ROCKETMQ_ENABLED: "true"
  commerce:
    restart: "no"
    deploy:
      replicas: 2
    ports: !reset []
    environment:
      CITYCOPILOT_COMMERCE_DB_URL: jdbc:mysql://commerce-mysql:3306/citycopilot_commerce_load_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
      CITYCOPILOT_PLACE_BASE_URL: http://frontend:8082
      CITYCOPILOT_ROCKETMQ_ENABLED: "true"
  frontend:
    # The extra loopback listeners let the runner measure backend capacity separately from IP rejection.
    ports: !override ["127.0.0.1:18090:8080", "127.0.0.1:18092:8082", "127.0.0.1:18094:8084"]
    volumes:
      - ./deploy/nginx/citycopilot-load-upstreams.conf:/etc/nginx/conf.d/upstreams.conf:ro
