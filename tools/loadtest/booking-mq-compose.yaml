name: citycopilot-booking-load

# 预约压测专用的单节点 Kafka，对宿主机暴露 127.0.0.1:18089；本地启动的 Commerce 用
# --spring.kafka.bootstrap-servers=127.0.0.1:18089 连接。与日常 compose 的三节点集群互不影响。
services:
  kafka:
    image: apache/kafka:4.1.2
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:18089,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:18089
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:18089:18089"
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:18089 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
  kafka-init:
    image: apache/kafka:4.1.2
    # 共用 kafka 容器的网络命名空间，localhost:18089 与对外通告地址一致。
    network_mode: "service:kafka"
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for topic in citycopilot-commerce-events-v1 citycopilot-ops-events-v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:18089 --create --if-not-exists \
            --topic "$$topic" --partitions 6 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy
