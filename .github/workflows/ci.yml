name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend
        run: mvn -q clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  contracts-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Tool and Event contracts
        run: mvn -q -pl backend/contracts,backend/mcp-server -am test
      - name: Run deterministic offline Agent eval
        run: mvn -q -pl backend/eval -am -DskipTests package exec:java

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-production CI environment
        run: cp .env.example .env
      - name: Build and start the complete topology
        run: docker compose --profile app up -d --build --wait
      - name: Verify health and routes
        shell: pwsh
        run: |
          Invoke-RestMethod http://127.0.0.1:8081/actuator/health
          Invoke-RestMethod http://127.0.0.1:8082/agent/ready
          Invoke-RestMethod http://127.0.0.1:8090/mcp/tools/list
      - name: Capture failure context
        if: failure()
        run: docker compose --profile app logs --no-color --tail 300
      - name: Stop ephemeral CI topology
        if: always()
        run: docker compose --profile app down -v
