resolver 127.0.0.11 valid=5s ipv6=off;

upstream core_backend {
    zone core_backend 64k;
    server core:8081 resolve;
    keepalive 32;
}

upstream commerce_backend {
    zone commerce_backend 64k;
    server commerce:8083 resolve;
    keepalive 32;
}

# Record routing evidence only in the isolated load deployment.
log_format load_upstream '$uri $upstream_addr';
access_log /var/log/nginx/load-upstreams.log load_upstream;

# Internal service routing, also exposed on host loopback for isolated load checks.
server {
    listen 8082;
    location / {
        proxy_pass http://core_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}

server {
    listen 8084;
    location / {
        proxy_pass http://commerce_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
