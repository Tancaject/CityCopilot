rule_files: [citycopilot-alerts.yml]
evaluation_interval: 15s
tests:
  - name: "scrape failure waits then resolves"
    interval: 1m
    input_series:
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"commerce:8083\"}", "values": "1 0x3 1x2"}
    alert_rule_test:
      - {"eval_time": "2m", "alertname": "CityCopilotTargetDown", "exp_alerts": []}
      - {"eval_time": "3m", "alertname": "CityCopilotTargetDown", "exp_alerts": [{"exp_labels": {"job": "citycopilot-commerce", "instance": "commerce:8083", "severity": "critical"}, "exp_annotations": {"summary": "CityCopilot 服务指标连续抓取失败", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#target-down"}}]}
      - {"eval_time": "5m", "alertname": "CityCopilotTargetDown", "exp_alerts": []}
  - name: "shared queue replicas use max and recover after backlog drains"
    interval: 1m
    input_series:
      - {"series": "up{job=\"citycopilot-core\",instance=\"core-a:8081\",projection_role=\"true\"}", "values": "1x10"}
      - {"series": "citycopilot_shop_projection_oldest_age_seconds{job=\"citycopilot-core\",instance=\"core-a:8081\",projection_role=\"true\"}", "values": "80 80 180x5 0x2"}
      - {"series": "up{job=\"citycopilot-core\",instance=\"core-b:8081\",projection_role=\"true\"}", "values": "1x10"}
      - {"series": "citycopilot_shop_projection_oldest_age_seconds{job=\"citycopilot-core\",instance=\"core-b:8081\",projection_role=\"true\"}", "values": "80x10"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"commerce-a:8083\",outbox_relay_role=\"true\"}", "values": "1x10"}
      - {"series": "citycopilot_commerce_outbox_oldest_ready_age_seconds{job=\"citycopilot-commerce\",instance=\"commerce-a:8083\",outbox_relay_role=\"true\"}", "values": "80 80 180x5 0x2"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"commerce-b:8083\",outbox_relay_role=\"true\"}", "values": "1x10"}
      - {"series": "citycopilot_commerce_outbox_oldest_ready_age_seconds{job=\"citycopilot-commerce\",instance=\"commerce-b:8083\",outbox_relay_role=\"true\"}", "values": "80x10"}
      - {"series": "citycopilot_shop_projection_sample_timestamp_seconds{job=\"citycopilot-core\",instance=\"core-a:8081\",projection_role=\"true\"}", "values": "1+60x10"}
      - {"series": "citycopilot_shop_projection_sample_timestamp_seconds{job=\"citycopilot-core\",instance=\"core-b:8081\",projection_role=\"true\"}", "values": "1+60x10"}
    alert_rule_test:
      - {"eval_time": "6m", "alertname": "CityCopilotCommerceOutboxAge", "exp_alerts": []}
      - {"eval_time": "7m", "alertname": "CityCopilotCommerceOutboxAge", "exp_alerts": [{"exp_labels": {"job": "citycopilot-commerce", "queue": "commerce-outbox", "severity": "warning"}, "exp_annotations": {"summary": "Commerce 最老未发布事件持续超时", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#commerce-outbox"}}]}
      - {"eval_time": "8m", "alertname": "CityCopilotCommerceOutboxAge", "exp_alerts": []}
      - {"eval_time": "6m", "alertname": "CityCopilotShopProjectionAge", "exp_alerts": []}
      - {"eval_time": "7m", "alertname": "CityCopilotShopProjectionAge", "exp_alerts": [{"exp_labels": {"job": "citycopilot-core", "queue": "shop-projection", "severity": "warning"}, "exp_annotations": {"summary": "店铺 GEO 投影积压持续超时", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#shop-projection"}}]}
      - {"eval_time": "8m", "alertname": "CityCopilotShopProjectionAge", "exp_alerts": []}
  - name: "stale zero and absent samples alert without using old queue ages"
    interval: 1m
    input_series:
      - {"series": "up{job=\"citycopilot-core\",instance=\"stale:8081\",projection_role=\"true\"}", "values": "1x10"}
      - {"series": "citycopilot_shop_projection_sample_timestamp_seconds{job=\"citycopilot-core\",instance=\"stale:8081\",projection_role=\"true\"}", "values": "1x5 361+60x4"}
      - {"series": "citycopilot_shop_projection_oldest_age_seconds{job=\"citycopilot-core\",instance=\"stale:8081\",projection_role=\"true\"}", "values": "300x10"}
      - {"series": "up{job=\"citycopilot-core\",instance=\"never:8081\",projection_role=\"true\"}", "values": "1x10"}
      - {"series": "citycopilot_shop_projection_sample_timestamp_seconds{job=\"citycopilot-core\",instance=\"never:8081\",projection_role=\"true\"}", "values": "0x5 361+60x4"}
      - {"series": "citycopilot_shop_projection_oldest_age_seconds{job=\"citycopilot-core\",instance=\"never:8081\",projection_role=\"true\"}", "values": "300x10"}
      - {"series": "up{job=\"citycopilot-core\",instance=\"missing:8081\",projection_role=\"true\"}", "values": "1x10"}
      - {"series": "citycopilot_shop_projection_sample_timestamp_seconds{job=\"citycopilot-core\",instance=\"missing:8081\",projection_role=\"true\"}", "values": "_ _ _ _ _ _ 361+60x4"}
      - {"series": "citycopilot_shop_projection_oldest_age_seconds{job=\"citycopilot-core\",instance=\"missing:8081\",projection_role=\"true\"}", "values": "300x10"}
      - {"series": "up{job=\"citycopilot-core\",instance=\"api-only:8081\"}", "values": "1x10"}
      - {"series": "up{job=\"citycopilot-core\",instance=\"down:8081\",projection_role=\"true\"}", "values": "0x10"}
    alert_rule_test:
      - {"eval_time": "1m", "alertname": "CityCopilotProjectionSampleStale", "exp_alerts": []}
      - {"eval_time": "4m", "alertname": "CityCopilotProjectionSampleStale", "exp_alerts": [{"exp_labels": {"job": "citycopilot-core", "instance": "stale:8081", "projection_role": "true", "severity": "warning"}, "exp_annotations": {"summary": "店铺投影积压采样失鲜或缺失", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#sample-unavailable"}}, {"exp_labels": {"job": "citycopilot-core", "instance": "never:8081", "projection_role": "true", "severity": "warning"}, "exp_annotations": {"summary": "店铺投影积压采样失鲜或缺失", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#sample-unavailable"}}, {"exp_labels": {"job": "citycopilot-core", "instance": "missing:8081", "projection_role": "true", "severity": "warning"}, "exp_annotations": {"summary": "店铺投影积压采样失鲜或缺失", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#sample-unavailable"}}]}
      - {"eval_time": "6m", "alertname": "CityCopilotProjectionSampleStale", "exp_alerts": []}
      - {"eval_time": "5m", "alertname": "CityCopilotShopProjectionAge", "exp_alerts": []}
  - name: "outbox NaN or missing metrics alert only on expected live relay roles"
    interval: 1m
    input_series:
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"nan:8083\",outbox_relay_role=\"true\"}", "values": "1x6"}
      - {"series": "citycopilot_commerce_outbox_oldest_ready_age_seconds{job=\"citycopilot-commerce\",instance=\"nan:8083\",outbox_relay_role=\"true\"}", "values": "NaN NaN NaN 0x3"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"missing:8083\",outbox_relay_role=\"true\"}", "values": "1x6"}
      - {"series": "citycopilot_commerce_outbox_oldest_ready_age_seconds{job=\"citycopilot-commerce\",instance=\"missing:8083\",outbox_relay_role=\"true\"}", "values": "_ _ _ 0x3"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"api-only:8083\"}", "values": "1x6"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"down:8083\",outbox_relay_role=\"true\"}", "values": "0x6"}
    alert_rule_test:
      - {"eval_time": "1m", "alertname": "CityCopilotOutboxMetricUnavailable", "exp_alerts": []}
      - {"eval_time": "2m", "alertname": "CityCopilotOutboxMetricUnavailable", "exp_alerts": [{"exp_labels": {"job": "citycopilot-commerce", "instance": "nan:8083", "outbox_relay_role": "true", "severity": "warning"}, "exp_annotations": {"summary": "Commerce Outbox 指标缺失或采样失败", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#sample-unavailable"}}, {"exp_labels": {"job": "citycopilot-commerce", "instance": "missing:8083", "outbox_relay_role": "true", "severity": "warning"}, "exp_annotations": {"summary": "Commerce Outbox 指标缺失或采样失败", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#sample-unavailable"}}]}
      - {"eval_time": "3m", "alertname": "CityCopilotOutboxMetricUnavailable", "exp_alerts": []}
      - {"eval_time": "2m", "alertname": "CityCopilotCommerceOutboxAge", "exp_alerts": []}
  - name: "order completion uses durable backlog across replicas and recovers"
    interval: 1m
    input_series:
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"commerce-a:8083\"}", "values": "1x10"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"commerce-b:8083\"}", "values": "1x10"}
      - {"series": "citycopilot_commerce_order_pending_oldest_age_seconds{job=\"citycopilot-commerce\",instance=\"commerce-a:8083\"}", "values": "80 80 180x5 0x2"}
      - {"series": "citycopilot_commerce_order_pending_oldest_age_seconds{job=\"citycopilot-commerce\",instance=\"commerce-b:8083\"}", "values": "80x10"}
      - {"series": "citycopilot_commerce_order_repair_required{job=\"citycopilot-commerce\",instance=\"commerce-a:8083\"}", "values": "0 0 1x5 0x2"}
      - {"series": "citycopilot_commerce_order_repair_required{job=\"citycopilot-commerce\",instance=\"commerce-b:8083\"}", "values": "0x10"}
      - {"series": "citycopilot_commerce_order_completion_sample_timestamp_seconds{job=\"citycopilot-commerce\",instance=\"commerce-a:8083\"}", "values": "1+60x10"}
      - {"series": "citycopilot_commerce_order_completion_sample_timestamp_seconds{job=\"citycopilot-commerce\",instance=\"commerce-b:8083\"}", "values": "1+60x10"}
    alert_rule_test:
      - {"eval_time": "6m", "alertname": "CityCopilotOrderCompletionAge", "exp_alerts": []}
      - {"eval_time": "7m", "alertname": "CityCopilotOrderCompletionAge", "exp_alerts": [{"exp_labels": {"job": "citycopilot-commerce", "queue": "commerce-admission", "severity": "warning"}, "exp_annotations": {"summary": "已受理订单持续未完成持久化", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#order-completion"}}]}
      - {"eval_time": "8m", "alertname": "CityCopilotOrderCompletionAge", "exp_alerts": []}
      - {"eval_time": "3m", "alertname": "CityCopilotAdmissionRepairRequired", "exp_alerts": []}
      - {"eval_time": "4m", "alertname": "CityCopilotAdmissionRepairRequired", "exp_alerts": [{"exp_labels": {"job": "citycopilot-commerce", "queue": "commerce-admission", "severity": "critical"}, "exp_annotations": {"summary": "订单准入账本存在需要人工修复的记录", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#order-completion"}}]}
      - {"eval_time": "8m", "alertname": "CityCopilotAdmissionRepairRequired", "exp_alerts": []}
  - name: "order completion stale zero and missing samples cannot hide behind healthy scrape"
    interval: 1m
    input_series:
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"stale:8083\"}", "values": "1x10"}
      - {"series": "citycopilot_commerce_order_completion_sample_timestamp_seconds{job=\"citycopilot-commerce\",instance=\"stale:8083\"}", "values": "1x5 361+60x4"}
      - {"series": "citycopilot_commerce_order_pending_oldest_age_seconds{job=\"citycopilot-commerce\",instance=\"stale:8083\"}", "values": "300x10"}
      - {"series": "citycopilot_commerce_order_repair_required{job=\"citycopilot-commerce\",instance=\"stale:8083\"}", "values": "1x10"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"never:8083\"}", "values": "1x10"}
      - {"series": "citycopilot_commerce_order_completion_sample_timestamp_seconds{job=\"citycopilot-commerce\",instance=\"never:8083\"}", "values": "0x5 361+60x4"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"missing:8083\"}", "values": "1x10"}
      - {"series": "citycopilot_commerce_order_completion_sample_timestamp_seconds{job=\"citycopilot-commerce\",instance=\"missing:8083\"}", "values": "_ _ _ _ _ _ 361+60x4"}
      - {"series": "up{job=\"citycopilot-commerce\",instance=\"down:8083\"}", "values": "0x10"}
    alert_rule_test:
      - {"eval_time": "1m", "alertname": "CityCopilotOrderCompletionSampleStale", "exp_alerts": []}
      - {"eval_time": "4m", "alertname": "CityCopilotOrderCompletionSampleStale", "exp_alerts": [{"exp_labels": {"job": "citycopilot-commerce", "instance": "stale:8083", "severity": "warning"}, "exp_annotations": {"summary": "订单持久化完成指标采样失鲜或缺失", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#sample-unavailable"}}, {"exp_labels": {"job": "citycopilot-commerce", "instance": "never:8083", "severity": "warning"}, "exp_annotations": {"summary": "订单持久化完成指标采样失鲜或缺失", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#sample-unavailable"}}, {"exp_labels": {"job": "citycopilot-commerce", "instance": "missing:8083", "severity": "warning"}, "exp_annotations": {"summary": "订单持久化完成指标采样失鲜或缺失", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#sample-unavailable"}}]}
      - {"eval_time": "6m", "alertname": "CityCopilotOrderCompletionSampleStale", "exp_alerts": []}
      - {"eval_time": "5m", "alertname": "CityCopilotOrderCompletionAge", "exp_alerts": []}
      - {"eval_time": "4m", "alertname": "CityCopilotAdmissionRepairRequired", "exp_alerts": []}
  - name: "kafka consumer lag uses the worst client and clears after catch-up"
    interval: 1m
    input_series:
      - {"series": "up{job=\"citycopilot-core\",instance=\"core-a:8081\"}", "values": "1x10"}
      - {"series": "kafka_consumer_fetch_manager_records_lag_max{job=\"citycopilot-core\",instance=\"core-a:8081\",client_id=\"consumer-citycopilot-event-audit-v1-1\"}", "values": "10 10 5000x5 0x2"}
      - {"series": "kafka_consumer_fetch_manager_records_lag_max{job=\"citycopilot-core\",instance=\"core-a:8081\",client_id=\"consumer-citycopilot-event-audit-v1-2\"}", "values": "600x10"}
    alert_rule_test:
      - {"eval_time": "6m", "alertname": "CityCopilotKafkaConsumerLag", "exp_alerts": []}
      - {"eval_time": "7m", "alertname": "CityCopilotKafkaConsumerLag", "exp_alerts": [{"exp_labels": {"job": "citycopilot-core", "queue": "kafka-events", "severity": "warning"}, "exp_annotations": {"summary": "Kafka 事件消费积压持续过高", "runbook_url": "https://github.com/Tancaject/CityCopilot/blob/main/docs/operations/queue-alerts.md#kafka-consumer-lag"}}]}
      - {"eval_time": "8m", "alertname": "CityCopilotKafkaConsumerLag", "exp_alerts": []}
