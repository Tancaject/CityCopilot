server:
  port: ${AGENT_SERVER_PORT:8082}

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: citycopilot-agent-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CITYCOPILOT_AGENT_DB_URL:jdbc:mysql://127.0.0.1:3308/citycopilot_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${CITYCOPILOT_AGENT_DB_USERNAME:citycopilot_agent}
    password: ${CITYCOPILOT_AGENT_DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/002-user-preference-memory.sql
  data:
    redis:
      host: ${CITYCOPILOT_AGENT_REDIS_HOST:${CITYCOPILOT_REDIS_HOST:127.0.0.1}}
      port: ${CITYCOPILOT_AGENT_REDIS_PORT:${CITYCOPILOT_REDIS_PORT:6380}}
      password: ${CITYCOPILOT_AGENT_REDIS_PASSWORD:${CITYCOPILOT_REDIS_PASSWORD:}}
      database: ${AGENT_REDIS_DATABASE:1}

citycopilot:
  core-service:
    base-url: ${CITYCOPILOT_CORE_BASE_URL:http://127.0.0.1:8081}
    service-token: ${CITYCOPILOT_INTERNAL_AGENT_TOKEN:${CITYCOPILOT_INTERNAL_SERVICE_TOKEN:}}
    ops-service-token: ${CITYCOPILOT_INTERNAL_OPS_TOKEN:}
    ops-reader-service-token: ${CITYCOPILOT_INTERNAL_OPS_READER_TOKEN:}
    ops-executor-service-token: ${CITYCOPILOT_INTERNAL_OPS_EXECUTOR_TOKEN:}
    connect-timeout: ${CITYCOPILOT_CORE_CONNECT_TIMEOUT:2s}
    read-timeout: ${CITYCOPILOT_CORE_READ_TIMEOUT:4s}
    catalog-ttl: ${CITYCOPILOT_TOOL_CATALOG_TTL:30s}
  ai:
    enabled: ${CITYCOPILOT_AI_ENABLED:false}
    api-key: ${CITYCOPILOT_AI_API_KEY:}
    api-url: ${CITYCOPILOT_AI_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    model: ${CITYCOPILOT_AI_MODEL:qwen-plus}
    timeout-seconds: ${CITYCOPILOT_AI_TIMEOUT_SECONDS:8}
    max-message-length: ${CITYCOPILOT_AI_MAX_MESSAGE_LENGTH:300}
  ops-v2:
    enabled: ${OPS_AGENT_V2_ENABLED:true}
    worker-id: ${HOSTNAME:local-agent}
    evidence-ttl: ${CITYCOPILOT_OPS_EVIDENCE_TTL:2m}
    lease-duration: ${CITYCOPILOT_OPS_LEASE_DURATION:30s}
    approval-ttl: ${CITYCOPILOT_OPS_APPROVAL_TTL:15m}
    reader-threads: ${CITYCOPILOT_OPS_READER_THREADS:2}
    executor-threads: ${CITYCOPILOT_OPS_EXECUTOR_THREADS:1}
  rocketmq:
    enabled: ${CITYCOPILOT_ROCKETMQ_ENABLED:false}
    endpoints: ${CITYCOPILOT_ROCKETMQ_ENDPOINTS:127.0.0.1:18081}
    ops-topic: citycopilot-ops-events-v1
    consumer-group: citycopilot-ops-agent-v2
    request-timeout: ${CITYCOPILOT_ROCKETMQ_REQUEST_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
