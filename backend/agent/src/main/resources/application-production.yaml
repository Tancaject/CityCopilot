server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${CITYCOPILOT_SHUTDOWN_TIMEOUT:60s}
  sql:
    init:
      mode: never
  datasource:
    hikari:
      maximum-pool-size: ${CITYCOPILOT_AGENT_DB_POOL_MAX:10}
      minimum-idle: ${CITYCOPILOT_AGENT_DB_POOL_MIN:2}
      connection-timeout: ${CITYCOPILOT_AGENT_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${CITYCOPILOT_AGENT_DB_VALIDATION_TIMEOUT_MS:2000}
      max-lifetime: ${CITYCOPILOT_AGENT_DB_MAX_LIFETIME_MS:1500000}
  data:
    redis:
      timeout: ${CITYCOPILOT_AGENT_REDIS_TIMEOUT:2s}
      connect-timeout: ${CITYCOPILOT_AGENT_REDIS_CONNECT_TIMEOUT:2s}

citycopilot:
  runtime:
    require-shared-state: true
  ops:
    worker-enabled: ${CITYCOPILOT_OPS_WORKER_ENABLED:false}
  ops-v2:
    worker-enabled: ${CITYCOPILOT_OPS_V2_WORKER_ENABLED:false}
  rocketmq:
    consumer-enabled: ${CITYCOPILOT_ROCKETMQ_CONSUMER_ENABLED:false}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,coreTools
