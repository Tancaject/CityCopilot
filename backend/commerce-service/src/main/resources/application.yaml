server:
  port: ${CITYCOPILOT_COMMERCE_PORT:8083}

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: citycopilot-commerce-service
  jackson:
    use-jackson2-defaults: true
  datasource:
    url: ${CITYCOPILOT_COMMERCE_DB_URL:jdbc:mysql://127.0.0.1:3309/citycopilot_commerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${CITYCOPILOT_COMMERCE_DB_USERNAME:citycopilot_commerce}
    password: ${CITYCOPILOT_COMMERCE_DB_PASSWORD:}
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  data:
    redis:
      host: ${CITYCOPILOT_REDIS_HOST:127.0.0.1}
      port: ${CITYCOPILOT_REDIS_PORT:6380}
      username: ${CITYCOPILOT_COMMERCE_REDIS_USERNAME:commerce}
      password: ${CITYCOPILOT_COMMERCE_REDIS_PASSWORD:${CITYCOPILOT_REDIS_PASSWORD:}}

citycopilot:
  booking:
    checkin-secret: ${CITYCOPILOT_BOOKING_CHECKIN_SECRET:${citycopilot.commerce.service-token:}}
    quote-cleanup:
      enabled: ${CITYCOPILOT_BOOKING_QUOTE_CLEANUP_ENABLED:false}
      retention-days: ${CITYCOPILOT_BOOKING_QUOTE_RETENTION_DAYS:-1}
      batch-size: ${CITYCOPILOT_BOOKING_QUOTE_CLEANUP_BATCH_SIZE:100}
      interval-ms: ${CITYCOPILOT_BOOKING_QUOTE_CLEANUP_INTERVAL_MS:60000}
  commerce:
    outbox-archive:
      enabled: ${CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_ENABLED:false}
      retention-days: ${CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_RETENTION_DAYS:-1}
      batch-size: ${CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_BATCH_SIZE:100}
      interval-ms: ${CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_INTERVAL_MS:60000}
    service-token: ${CITYCOPILOT_INTERNAL_COMMERCE_TOKEN:}
    payment-signing-secret: ${CITYCOPILOT_PAYMENT_SIGNING_SECRET:}
    previous-service-token: ${CITYCOPILOT_INTERNAL_COMMERCE_PREVIOUS_TOKEN:}
    stream-enabled: ${CITYCOPILOT_COMMERCE_STREAM_ENABLED:true}
    api-enabled: ${CITYCOPILOT_COMMERCE_API_ENABLED:true}
    stream-worker-enabled: ${CITYCOPILOT_COMMERCE_STREAM_WORKER_ENABLED:${CITYCOPILOT_COMMERCE_STREAM_ENABLED:true}}
    outbox-relay-enabled: ${CITYCOPILOT_COMMERCE_OUTBOX_RELAY_ENABLED:true}
    reconciliation-enabled: ${CITYCOPILOT_COMMERCE_RECONCILIATION_ENABLED:true}
    inventory-bootstrap-enabled: ${CITYCOPILOT_COMMERCE_INVENTORY_BOOTSTRAP_ENABLED:true}
    redis-physical-shard-count: ${CITYCOPILOT_COMMERCE_REDIS_PHYSICAL_SHARD_COUNT:1}
    redis-routing-generation: ${CITYCOPILOT_COMMERCE_REDIS_ROUTING_GENERATION:v1}
    consumer-name: ${HOSTNAME:commerce-local}
    stream-batch-size: ${CITYCOPILOT_COMMERCE_STREAM_BATCH_SIZE:100}
    stream-max-deliveries: ${CITYCOPILOT_COMMERCE_STREAM_MAX_DELIVERIES:10}
    # Local single-node Redis has no replica. Production overrides this to 1.
    redis-required-replicas: ${CITYCOPILOT_COMMERCE_REDIS_REQUIRED_REPLICAS:0}
    redis-replication-timeout-ms: ${CITYCOPILOT_COMMERCE_REDIS_REPLICATION_TIMEOUT_MS:1000}
    admission-recovery-batch-size: ${CITYCOPILOT_COMMERCE_ADMISSION_RECOVERY_BATCH_SIZE:100}
    admission-recovery-min-age-ms: ${CITYCOPILOT_COMMERCE_ADMISSION_RECOVERY_MIN_AGE_MS:5000}
    admission-recovery-lease-ms: ${CITYCOPILOT_COMMERCE_ADMISSION_RECOVERY_LEASE_MS:30000}
    admission-recovery-recheck-ms: ${CITYCOPILOT_COMMERCE_ADMISSION_RECOVERY_RECHECK_MS:5000}
    admission-recovery-max-attempts: ${CITYCOPILOT_COMMERCE_ADMISSION_RECOVERY_MAX_ATTEMPTS:20}
    admission-recovery-poll-ms: ${CITYCOPILOT_COMMERCE_ADMISSION_RECOVERY_POLL_MS:1000}
    admission-max-backlog: ${CITYCOPILOT_COMMERCE_ADMISSION_MAX_BACKLOG:50000}
    admission-max-oldest-age-ms: ${CITYCOPILOT_COMMERCE_ADMISSION_MAX_OLDEST_AGE_MS:300000}
    admission-capacity-cache-ms: ${CITYCOPILOT_COMMERCE_ADMISSION_CAPACITY_CACHE_MS:1000}
    admission-metrics-refresh-ms: ${CITYCOPILOT_COMMERCE_ADMISSION_METRICS_REFRESH_MS:5000}
    id-segment-size: ${CITYCOPILOT_COMMERCE_ID_SEGMENT_SIZE:1024}
    metadata-update-fence-ttl-ms: ${CITYCOPILOT_COMMERCE_METADATA_UPDATE_FENCE_TTL_MS:300000}
    stream-poll-ms: ${CITYCOPILOT_COMMERCE_STREAM_POLL_MS:50}
    place-base-url: ${CITYCOPILOT_PLACE_BASE_URL:http://127.0.0.1:8081}
    rocketmq-enabled: ${CITYCOPILOT_ROCKETMQ_ENABLED:true}
    rocketmq-endpoints: ${CITYCOPILOT_ROCKETMQ_ENDPOINTS:127.0.0.1:18081}
    rocketmq-ssl-enabled: ${CITYCOPILOT_ROCKETMQ_SSL_ENABLED:false}
    rocketmq-access-key: ${CITYCOPILOT_ROCKETMQ_ACCESS_KEY:}
    rocketmq-secret-key: ${CITYCOPILOT_ROCKETMQ_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
