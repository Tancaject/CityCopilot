server:
  port: 8081
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-connections: 8192
    accept-count: 1000
    max-keep-alive-requests: 10000
    keep-alive-timeout: 30s

spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: citycopilot-core-service
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${CITYCOPILOT_DB_URL:jdbc:mysql://127.0.0.1:3307/citycopilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${CITYCOPILOT_DB_USERNAME:root}"
    password: "${CITYCOPILOT_DB_PASSWORD:}"
  data:
    redis:
      host: "${CITYCOPILOT_REDIS_HOST:127.0.0.1}"
      port: "${CITYCOPILOT_REDIS_PORT:6380}"
      password: "${CITYCOPILOT_REDIS_PASSWORD:}"
      database: "${CITYCOPILOT_REDIS_DATABASE:0}"
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    use-jackson2-defaults: true
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.citycopilot.core.entity

logging:
  level:
    com.citycopilot.core: debug

citycopilot:
  commerce:
    base-url: "${CITYCOPILOT_COMMERCE_BASE_URL:http://127.0.0.1:8083}"
    service-token: "${CITYCOPILOT_INTERNAL_COMMERCE_TOKEN:}"
  internal-api:
    service-tokens:
      commerce-service: "${CITYCOPILOT_INTERNAL_COMMERCE_TOKEN:}"
    previous-service-tokens:
      commerce-service: "${CITYCOPILOT_INTERNAL_COMMERCE_PREVIOUS_TOKEN:}"
  audit:
    retention-days: "${CITYCOPILOT_AUDIT_RETENTION_DAYS:90}"
    export-limit: "${CITYCOPILOT_AUDIT_EXPORT_LIMIT:1000}"
  security:
    login-code-rate-limit-per-phone: 3
    role-permissions:
      admin:
        - "*"
      geo_operator:
        - admin:access
        - geo:read
        - geo:write
        - audit:read
      auditor:
        - admin:access
        - geo:read
        - audit:read
      merchant:
        - admin:access
        - shop:write
        - voucher:write
        - order:write
        - booking:manage
        - booking:check-in
  upload:
    root-dir: "${CITYCOPILOT_UPLOAD_ROOT:uploads}"
    public-prefix: "${CITYCOPILOT_UPLOAD_PUBLIC_PREFIX:/uploads}"
    max-image-size-bytes: 5242880
    allowed-image-extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
    allowed-image-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
  projection:
    cleanup:
      enabled: "${CITYCOPILOT_PROJECTION_CLEANUP_ENABLED:false}"
      retention: "${CITYCOPILOT_PROJECTION_CLEANUP_RETENTION:0s}"
      reader-grace: "${CITYCOPILOT_PROJECTION_CLEANUP_READER_GRACE:0s}"
      generation-batch-size: "${CITYCOPILOT_PROJECTION_CLEANUP_GENERATION_BATCH_SIZE:10}"
      key-batch-size: "${CITYCOPILOT_PROJECTION_CLEANUP_KEY_BATCH_SIZE:500}"
  geo:
    auto-sync-shop-index: true
    nearby-radius-meters: 5000
    local-discovery-mode: "${CITYCOPILOT_GEO_LOCAL_DISCOVERY_MODE:redis}"
    redis-candidate-multiplier: "${CITYCOPILOT_GEO_REDIS_CANDIDATE_MULTIPLIER:3}"
    redis-max-candidates: "${CITYCOPILOT_GEO_REDIS_MAX_CANDIDATES:500}"
    reconcile-enabled: "${CITYCOPILOT_GEO_RECONCILE_ENABLED:true}"
    reconcile-interval-ms: "${CITYCOPILOT_GEO_RECONCILE_INTERVAL_MS:60000}"
    max-batch-size: 100
    default-city: "${CITYCOPILOT_GEO_DEFAULT_CITY:杭州}"
    city-limit: true
    shop-page-size: 5
    max-shop-page-size: 20
  amap:
    web-service-key: "${CITYCOPILOT_AMAP_WEB_SERVICE_KEY:}"
    geocode-url: https://restapi.amap.com/v3/geocode/geo
    poi-text-url: https://restapi.amap.com/v3/place/text
    poi-around-url: https://restapi.amap.com/v3/place/around
    cache-ttl-minutes: 1440
    rate-limit-per-minute: 60
    circuit-failure-threshold: 5
    circuit-open-seconds: 120
    metrics-ttl-days: 7
  rocketmq:
    enabled: "${CITYCOPILOT_ROCKETMQ_ENABLED:true}"
    consumer-enabled: "${CITYCOPILOT_ROCKETMQ_CONSUMER_ENABLED:true}"
    ssl-enabled: "${CITYCOPILOT_ROCKETMQ_SSL_ENABLED:false}"
    access-key: "${CITYCOPILOT_ROCKETMQ_ACCESS_KEY:}"
    secret-key: "${CITYCOPILOT_ROCKETMQ_SECRET_KEY:}"
    endpoints: "${CITYCOPILOT_ROCKETMQ_ENDPOINTS:127.0.0.1:18081}"
    commerce-topic: citycopilot-commerce-events-v1
    ops-topic: citycopilot-ops-events-v1
    audit-consumer-group: citycopilot-event-audit-v1
    request-timeout: "${CITYCOPILOT_ROCKETMQ_REQUEST_TIMEOUT:3s}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: city-copilot
