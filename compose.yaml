name: ${COMPOSE_PROJECT_NAME:-citycopilot}

x-kafka-env: &kafka-env
  CLUSTER_ID: Y2l0eWNvcGlsb3RrYWZrYQ
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}

services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_MYSQL_MEMORY_LIMIT:-1g}
    environment:
      MYSQL_ROOT_PASSWORD: ${CITYCOPILOT_MYSQL_ROOT_PASSWORD:?Run tools/citycopilot.ps1 start first}
      MYSQL_DATABASE: citycopilot
      MYSQL_USER: ${CITYCOPILOT_DB_USERNAME:-citycopilot}
      MYSQL_PASSWORD: ${CITYCOPILOT_DB_PASSWORD:?Run tools/citycopilot.ps1 start first}
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:${CITYCOPILOT_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D citycopilot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - citycopilot

  commerce-mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_COMMERCE_MYSQL_MEMORY_LIMIT:-512m}
    environment:
      MYSQL_ROOT_PASSWORD: ${CITYCOPILOT_COMMERCE_MYSQL_ROOT_PASSWORD:?Run tools/citycopilot.ps1 start first}
      MYSQL_DATABASE: citycopilot_commerce
      MYSQL_USER: ${CITYCOPILOT_COMMERCE_DB_USERNAME:-citycopilot_commerce}
      MYSQL_PASSWORD: ${CITYCOPILOT_COMMERCE_DB_PASSWORD:?Run tools/citycopilot.ps1 start first}
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:${CITYCOPILOT_COMMERCE_MYSQL_PORT:-3309}:3306"
    volumes:
      - commerce-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D citycopilot_commerce -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - citycopilot

  core-migrate:
    image: flyway/flyway:10.20.1
    restart: "no"
    command: migrate
    environment:
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
      FLYWAY_URL: jdbc:mysql://mysql:3306/citycopilot?useSSL=false&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8
      FLYWAY_USER: ${CITYCOPILOT_DB_USERNAME:-citycopilot}
      FLYWAY_PASSWORD: ${CITYCOPILOT_DB_PASSWORD:?Run tools/citycopilot.ps1 start first}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_BASELINE_VERSION: "1"
    volumes:
      - ./deploy/mysql/core:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - citycopilot

  commerce-migrate:
    image: flyway/flyway:10.20.1
    restart: "no"
    command: migrate
    environment:
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
      FLYWAY_URL: jdbc:mysql://commerce-mysql:3306/citycopilot_commerce?useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8
      FLYWAY_USER: ${CITYCOPILOT_COMMERCE_DB_USERNAME:-citycopilot_commerce}
      FLYWAY_PASSWORD: ${CITYCOPILOT_COMMERCE_DB_PASSWORD:?Run tools/citycopilot.ps1 start first}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_BASELINE_VERSION: "1"
    volumes:
      - ./deploy/mysql/commerce:/flyway/sql:ro
    depends_on:
      commerce-mysql:
        condition: service_healthy
    networks:
      - citycopilot

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_REDIS_MEMORY_LIMIT:-256m}
    environment:
      REDIS_PASSWORD: ${CITYCOPILOT_REDIS_PASSWORD:?Run tools/citycopilot.ps1 start first}
      REDIS_MAXMEMORY: ${CITYCOPILOT_REDIS_MAXMEMORY:-192mb}
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
    command:
      - sh
      - -c
      # Core 缓存/会话 Redis：内存满时只淘汰带 TTL 的键（缓存、令牌、限流计数），GEO 索引等不淘汰。
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy volatile-lru
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:${CITYCOPILOT_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - citycopilot

  # Commerce 交易 Redis（库存、准入、Stream）：与缓存隔离，内存满时拒绝写入而不是淘汰；
  # ACL 用户写在启动参数里，重启后自动恢复；准入写入用 WAIT 等待下面的副本确认。
  commerce-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_COMMERCE_REDIS_MEMORY_LIMIT:-256m}
    environment: &commerce-redis-env
      REDIS_PASSWORD: ${CITYCOPILOT_REDIS_PASSWORD:?Run tools/citycopilot.ps1 start first}
      COMMERCE_REDIS_PASSWORD: ${CITYCOPILOT_COMMERCE_REDIS_PASSWORD:?Run tools/citycopilot.ps1 start first}
      REDIS_MAXMEMORY: ${CITYCOPILOT_COMMERCE_REDIS_MAXMEMORY:-160mb}
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}" --masterauth "$${REDIS_PASSWORD}"
        --user commerce on ">$${COMMERCE_REDIS_PASSWORD}" "~commerce:*" "&commerce:*" "+@all" "-@dangerous" "+info"
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:${CITYCOPILOT_COMMERCE_REDIS_PORT:-6381}:6379"
    volumes:
      - commerce-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - citycopilot

  commerce-redis-replica:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_COMMERCE_REDIS_MEMORY_LIMIT:-256m}
    environment: *commerce-redis-env
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}" --masterauth "$${REDIS_PASSWORD}"
        --user commerce on ">$${COMMERCE_REDIS_PASSWORD}" "~commerce:*" "&commerce:*" "+@all" "-@dangerous" "+info"
        --replicaof commerce-redis 6379
    volumes:
      - commerce-redis-replica-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" info replication 2>/dev/null | grep -q 'master_link_status:up'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      commerce-redis:
        condition: service_healthy
    networks:
      - citycopilot

  # 定时逻辑备份到 backups-data 卷；恢复演练：docker compose exec backup bash /scripts/restore-drill.sh
  backup:
    image: mysql:8.4.10
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: ["bash", "/scripts/backup.sh"]
    environment:
      CORE_ROOT_PASSWORD: ${CITYCOPILOT_MYSQL_ROOT_PASSWORD:?Run tools/citycopilot.ps1 start first}
      COMMERCE_ROOT_PASSWORD: ${CITYCOPILOT_COMMERCE_MYSQL_ROOT_PASSWORD:?Run tools/citycopilot.ps1 start first}
      BACKUP_INTERVAL_SECONDS: ${CITYCOPILOT_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${CITYCOPILOT_BACKUP_RETENTION_DAYS:-7}
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./deploy/mysql/backup.sh:/scripts/backup.sh:ro
      - ./deploy/mysql/restore-drill.sh:/scripts/restore-drill.sh:ro
      - backups-data:/backups
    depends_on:
      mysql:
        condition: service_healthy
      commerce-mysql:
        condition: service_healthy
    networks:
      - citycopilot

  # Kafka 3 节点 KRaft 集群（每个节点同时是 broker 和 controller）。复制因子 3、min.insync.replicas=2，
  # 生产者 acks=all：挂 1 个节点写入不受影响，挂 2 个节点写入被拒、Outbox 积压待恢复。
  # 3 个节点在同一台机器上，演示的是副本语义，不是机器级高可用。
  kafka-permissions:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: sh -ec "chown -R 1000:1000 /kafka-1 /kafka-2 /kafka-3"
    volumes:
      - kafka-1-data:/kafka-1
      - kafka-2-data:/kafka-2
      - kafka-3-data:/kafka-3
    networks:
      - citycopilot

  kafka-1:
    image: apache/kafka:${CITYCOPILOT_KAFKA_VERSION:-4.1.2}
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_KAFKA_MEMORY_LIMIT:-1g}
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:19092:19092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    depends_on:
      kafka-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 20s
    networks:
      - citycopilot

  kafka-2:
    image: apache/kafka:${CITYCOPILOT_KAFKA_VERSION:-4.1.2}
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_KAFKA_MEMORY_LIMIT:-1g}
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://127.0.0.1:19093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19093,CONTROLLER://:9093
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:19093:19093"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    depends_on:
      kafka-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 20s
    networks:
      - citycopilot

  kafka-3:
    image: apache/kafka:${CITYCOPILOT_KAFKA_VERSION:-4.1.2}
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_KAFKA_MEMORY_LIMIT:-1g}
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://127.0.0.1:19094
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19094,CONTROLLER://:9093
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:19094:19094"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    depends_on:
      kafka-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 20s
    networks:
      - citycopilot

  kafka-init:
    image: apache/kafka:${CITYCOPILOT_KAFKA_VERSION:-4.1.2}
    restart: "no"
    mem_limit: 512m
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for topic in citycopilot-commerce-events-v1 citycopilot-ops-events-v1                      citycopilot-commerce-events-v1.DLT citycopilot-ops-events-v1.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists             --topic "$$topic" --partitions 6 --replication-factor 3 --config min.insync.replicas=2
        done
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - citycopilot

  kafka-ui:
    image: kafbat/kafka-ui:v1.4.2
    profiles: ["mq-dashboard"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KAFKA_CLUSTERS_0_NAME: citycopilot
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:${CITYCOPILOT_KAFKA_UI_PORT:-18082}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - citycopilot
  core:
    profiles: ["app"]
    image: citycopilot/core:local
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        MODULE: core
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_CORE_MEMORY_LIMIT:-1g}
    init: true
    environment:
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: production
      CITYCOPILOT_ROLE_PROJECTOR_ENABLED: "true"
      CITYCOPILOT_ROLE_RECONCILIATION_ENABLED: "true"
      CITYCOPILOT_UPLOAD_ENABLED: "true"
      CITYCOPILOT_DB_URL: jdbc:mysql://mysql:3306/citycopilot?useSSL=false&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8
      CITYCOPILOT_DB_USERNAME: ${CITYCOPILOT_DB_USERNAME:-citycopilot}
      CITYCOPILOT_DB_PASSWORD: ${CITYCOPILOT_DB_PASSWORD:?Run tools/citycopilot.ps1 start first}
      CITYCOPILOT_REDIS_HOST: redis
      CITYCOPILOT_REDIS_PORT: 6379
      CITYCOPILOT_REDIS_PASSWORD: ${CITYCOPILOT_REDIS_PASSWORD:?Run tools/citycopilot.ps1 start first}
      CITYCOPILOT_REDIS_DATABASE: 0
      CITYCOPILOT_INTERNAL_COMMERCE_TOKEN: ${CITYCOPILOT_INTERNAL_COMMERCE_TOKEN:?Run tools/citycopilot.ps1 start first}
      CITYCOPILOT_INTERNAL_COMMERCE_PREVIOUS_TOKEN: ${CITYCOPILOT_INTERNAL_COMMERCE_PREVIOUS_TOKEN:-}
      CITYCOPILOT_COMMERCE_BASE_URL: http://commerce:8083
      CITYCOPILOT_LOG_LOGIN_CODES: ${CITYCOPILOT_LOG_LOGIN_CODES:-false}
      CITYCOPILOT_UPLOAD_ROOT: /app/uploads
      CITYCOPILOT_AMAP_WEB_SERVICE_KEY: ${CITYCOPILOT_AMAP_WEB_SERVICE_KEY:-}
      CITYCOPILOT_GEO_LOCAL_DISCOVERY_MODE: ${CITYCOPILOT_GEO_LOCAL_DISCOVERY_MODE:-redis}
      CITYCOPILOT_GEO_REDIS_CANDIDATE_MULTIPLIER: ${CITYCOPILOT_GEO_REDIS_CANDIDATE_MULTIPLIER:-3}
      CITYCOPILOT_GEO_REDIS_MAX_CANDIDATES: ${CITYCOPILOT_GEO_REDIS_MAX_CANDIDATES:-500}
      CITYCOPILOT_GEO_RECONCILE_ENABLED: ${CITYCOPILOT_GEO_RECONCILE_ENABLED:-true}
      CITYCOPILOT_GEO_RECONCILE_INTERVAL_MS: ${CITYCOPILOT_GEO_RECONCILE_INTERVAL_MS:-60000}
      CITYCOPILOT_PROJECTION_CLEANUP_ENABLED: ${CITYCOPILOT_PROJECTION_CLEANUP_ENABLED:-false}
      CITYCOPILOT_PROJECTION_CLEANUP_RETENTION: ${CITYCOPILOT_PROJECTION_CLEANUP_RETENTION:-0s}
      CITYCOPILOT_PROJECTION_CLEANUP_READER_GRACE: ${CITYCOPILOT_PROJECTION_CLEANUP_READER_GRACE:-0s}
      CITYCOPILOT_PROJECTION_CLEANUP_GENERATION_BATCH_SIZE: ${CITYCOPILOT_PROJECTION_CLEANUP_GENERATION_BATCH_SIZE:-10}
      CITYCOPILOT_PROJECTION_CLEANUP_KEY_BATCH_SIZE: ${CITYCOPILOT_PROJECTION_CLEANUP_KEY_BATCH_SIZE:-500}
      CITYCOPILOT_KAFKA_ENABLED: ${CITYCOPILOT_KAFKA_ENABLED:-true}
      CITYCOPILOT_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:${CITYCOPILOT_CORE_PORT:-8081}:8081"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      commerce:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    networks:
      - citycopilot

  commerce:
    profiles: ["app"]
    image: citycopilot/commerce:local
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        MODULE: commerce-service
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_COMMERCE_MEMORY_LIMIT:-768m}
    init: true
    environment:
      TZ: ${CITYCOPILOT_TIMEZONE:-Asia/Shanghai}
      CITYCOPILOT_COMMERCE_PORT: 8083
      # 单机部署也跑生产配置；生产配置默认关闭的后台角色在这里显式打开（多副本靠租约互斥）。
      SPRING_PROFILES_ACTIVE: production
      CITYCOPILOT_COMMERCE_API_ENABLED: "true"
      CITYCOPILOT_COMMERCE_STREAM_WORKER_ENABLED: "true"
      CITYCOPILOT_COMMERCE_OUTBOX_RELAY_ENABLED: "true"
      CITYCOPILOT_COMMERCE_RECONCILIATION_ENABLED: "true"
      CITYCOPILOT_COMMERCE_INVENTORY_BOOTSTRAP_ENABLED: "true"
      # 单机 Redis 不需要多分片；改分片数要走 routing-generation 迁移，不能直接改这个值。
      CITYCOPILOT_COMMERCE_REDIS_PHYSICAL_SHARD_COUNT: ${CITYCOPILOT_COMMERCE_REDIS_PHYSICAL_SHARD_COUNT:-1}
      CITYCOPILOT_PAYMENT_SIGNING_SECRET: ${CITYCOPILOT_PAYMENT_SIGNING_SECRET:?Set CITYCOPILOT_PAYMENT_SIGNING_SECRET in .env (at least 32 bytes)}
      CITYCOPILOT_BOOKING_QUOTE_CLEANUP_ENABLED: ${CITYCOPILOT_BOOKING_QUOTE_CLEANUP_ENABLED:-false}
      CITYCOPILOT_BOOKING_QUOTE_RETENTION_DAYS: ${CITYCOPILOT_BOOKING_QUOTE_RETENTION_DAYS:--1}
      CITYCOPILOT_BOOKING_QUOTE_CLEANUP_BATCH_SIZE: ${CITYCOPILOT_BOOKING_QUOTE_CLEANUP_BATCH_SIZE:-100}
      CITYCOPILOT_BOOKING_QUOTE_CLEANUP_INTERVAL_MS: ${CITYCOPILOT_BOOKING_QUOTE_CLEANUP_INTERVAL_MS:-60000}
      CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_ENABLED: ${CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_ENABLED:-false}
      CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_RETENTION_DAYS: ${CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_RETENTION_DAYS:--1}
      CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_BATCH_SIZE: ${CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_BATCH_SIZE:-100}
      CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_INTERVAL_MS: ${CITYCOPILOT_COMMERCE_OUTBOX_ARCHIVE_INTERVAL_MS:-60000}
      CITYCOPILOT_COMMERCE_DB_URL: jdbc:mysql://commerce-mysql:3306/citycopilot_commerce?useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8
      CITYCOPILOT_COMMERCE_DB_USERNAME: ${CITYCOPILOT_COMMERCE_DB_USERNAME:-citycopilot_commerce}
      CITYCOPILOT_COMMERCE_DB_PASSWORD: ${CITYCOPILOT_COMMERCE_DB_PASSWORD:?Run tools/citycopilot.ps1 start first}
      CITYCOPILOT_COMMERCE_REDIS_HOST: commerce-redis
      CITYCOPILOT_COMMERCE_REDIS_PORT: 6379
      CITYCOPILOT_COMMERCE_REDIS_PASSWORD: ${CITYCOPILOT_COMMERCE_REDIS_PASSWORD:?Run tools/citycopilot.ps1 start first}
      CITYCOPILOT_INTERNAL_COMMERCE_TOKEN: ${CITYCOPILOT_INTERNAL_COMMERCE_TOKEN:?Run tools/citycopilot.ps1 start first}
      CITYCOPILOT_PLACE_BASE_URL: http://core:8081
      CITYCOPILOT_INTERNAL_COMMERCE_PREVIOUS_TOKEN: ${CITYCOPILOT_INTERNAL_COMMERCE_PREVIOUS_TOKEN:-}
      CITYCOPILOT_BOOKING_CHECKIN_SECRET: ${CITYCOPILOT_BOOKING_CHECKIN_SECRET:-${CITYCOPILOT_INTERNAL_COMMERCE_TOKEN}}
      CITYCOPILOT_KAFKA_ENABLED: ${CITYCOPILOT_KAFKA_ENABLED:-true}
      CITYCOPILOT_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:${CITYCOPILOT_COMMERCE_PORT:-8083}:8083"
    depends_on:
      commerce-mysql:
        condition: service_healthy
      commerce-migrate:
        condition: service_completed_successfully
      commerce-redis-replica:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - citycopilot

  frontend:
    profiles: ["app"]
    image: citycopilot/frontend:local
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_DEFAULT_CITY: ${VITE_DEFAULT_CITY:-杭州}
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    restart: unless-stopped
    mem_limit: ${CITYCOPILOT_FRONTEND_MEMORY_LIMIT:-128m}
    ports:
      - "${CITYCOPILOT_BIND_ADDRESS:-127.0.0.1}:${CITYCOPILOT_HTTP_PORT:-8080}:8080"
    volumes:
      - uploads-data:/data/citycopilot/uploads:ro
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - citycopilot

networks:
  citycopilot:
    driver: bridge

volumes:
  mysql-data:
  commerce-mysql-data:
  redis-data:
  commerce-redis-data:
  commerce-redis-replica-data:
  uploads-data:
  backups-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
