  <style type="text/css" data-vite-dev-id="D:/programming/CityCopilot/frontend/src/components/AiAssistantPanel.vue?vue&amp;type=style&amp;index=0&amp;lang.css">
/* ============================================================
   AI Cockpit · 2026 Refined Warm Light
   Scene-adaptive: consumer = warm paper, admin/ops = deep forest.
   Driven by body[data-scene] set in App.vue.
   Overrides global .ai-* rules from styles.css.
   ============================================================ */
.ai-assistant {
  /* Cockpit-local design tokens — flipped by body[data-scene="admin"] */
  --cp-canvas: oklch(98% 0.020 70);
  --cp-card: #ffffff;
  --cp-raised: oklch(96% 0.022 72);
  --cp-inset: oklch(94% 0.025 72);
  --cp-text: oklch(22% 0.018 60);
  --cp-text-sec: oklch(40% 0.016 55);
  --cp-text-mu: oklch(56% 0.014 55);
  --cp-hairline: oklch(22% 0.018 60 / 0.10);
  --cp-hairline-strong: oklch(22% 0.018 60 / 0.20);
  --cp-payload: oklch(96% 0.014 70);
  --cp-shadow: 0 2px 0 oklch(100% 0 0 / 0.6) inset, 0 32px 80px oklch(40% 0.04 60 / 0.22);
  --cp-edge-glow: 0 0 0 1px oklch(70% 0.18 42 / 0.18);

  position: fixed;
  right: max(20px, env(safe-area-inset-right, 20px));
  bottom: max(20px, env(safe-area-inset-bottom, 20px));
  z-index: 40;
}
body[data-scene="admin"] .ai-assistant {
  --cp-canvas: oklch(13% 0.012 165);
  --cp-card: oklch(17% 0.014 165);
  --cp-raised: oklch(22% 0.016 165);
  --cp-inset: oklch(11% 0.012 165);
  --cp-text: oklch(98% 0.012 80);
  --cp-text-sec: oklch(76% 0.014 80);
  --cp-text-mu: oklch(60% 0.014 80);
  --cp-hairline: oklch(100% 0 0 / 0.08);
  --cp-hairline-strong: oklch(100% 0 0 / 0.18);
  --cp-payload: oklch(0% 0 0 / 0.32);
  --cp-shadow: 0 1px 0 oklch(100% 0 0 / 0.04) inset, 0 40px 100px oklch(0% 0 0 / 0.55);
  --cp-edge-glow: 0 0 0 1px oklch(70% 0.18 42 / 0.22);
}

/* ---- FAB ---- */
.ai-assistant .ai-fab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 0 18px 0 12px;
  border: 1px solid oklch(70% 0.18 42 / 0.35);
  border-radius: var(--radius-pill);
  background: linear-gradient(135deg, #ffffff, oklch(96% 0.022 72));
  color: var(--cp-text);
  font-family: var(--font-sans);
  font-weight: 500;
  letter-spacing: -0.01em;
  box-shadow:
    inset 0 1px 0 oklch(100% 0 0 / 0.9),
    0 14px 32px oklch(70% 0.18 42 / 0.22),
    0 0 0 1px oklch(70% 0.18 42 / 0.18);
  cursor: pointer;
  transition: transform var(--dur) var(--ease-out-expo), box-shadow var(--dur) var(--ease-out-expo);
  isolation: isolate;
}
body[data-scene="admin"] .ai-assistant .ai-fab {
  background: linear-gradient(135deg, oklch(17% 0.014 165), oklch(13% 0.012 165));
  border-color: oklch(70% 0.18 42 / 0.4);
  color: oklch(98% 0.012 80);
  box-shadow:
    inset 0 1px 0 oklch(100% 0 0 / 0.06),
    0 16px 38px oklch(0% 0 0 / 0.45),
    0 0 0 1px oklch(0% 0 0 / 0.4);
}
.ai-assistant .ai-fab:hover {
  transform: translateY(-2px);
  box-shadow:
    inset 0 1px 0 oklch(100% 0 0 / 0.9),
    0 24px 56px oklch(70% 0.18 42 / 0.36),
    0 0 0 1px oklch(70% 0.18 42 / 0.6);
}
.ai-assistant[data-open="true"] .ai-fab {
  opacity: 0;
  pointer-events: none;
}
.ai-fab-glow {
  position: absolute;
  inset: -6px;
  z-index: -1;
  border-radius: inherit;
  background: radial-gradient(circle at center, var(--color-ember) 0%, transparent 60%);
  filter: blur(14px);
  opacity: 0.55;
  animation: ai-fab-breathe 3.4s ease-in-out infinite;
}
.ai-fab-core {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-pill);
  background: linear-gradient(135deg, var(--color-ember), var(--color-ember-strong));
  color: oklch(99% 0.01 70);
  box-shadow: inset 0 1px 0 oklch(100% 0 0 / 0.35);
}
.ai-fab-label {
  display: grid;
  text-align: left;
  line-height: 1;
}
.ai-fab-label small {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-ember-strong);
}
body[data-scene="admin"] .ai-fab-label small {
  color: var(--color-ember-soft);
}
.ai-fab-label strong {
  margin-top: 4px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
@keyframes ai-fab-breathe {
0%, 100% { opacity: 0.4; transform: scale(0.92);
}
50% { opacity: 0.85; transform: scale(1.12);
}
}

/* ---- Panel ---- */
.ai-assistant .ai-panel {
  position: absolute;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  width: min(560px, calc(100vw - 28px));
  max-height: min(82dvh, 780px);
  overflow: hidden;
  border: 1px solid var(--cp-hairline);
  border-radius: var(--radius-lg);
  background: var(--cp-card);
  color: var(--cp-text);
  box-shadow: var(--cp-shadow), var(--cp-edge-glow);
  transform-origin: bottom right;
  animation: ai-panel-in 0.28s var(--ease-out-expo);
  isolation: isolate;
}
.ai-assistant .ai-panel::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--color-ember) 50%, transparent);
  opacity: 0.55;
}
@keyframes ai-panel-in {
from { transform: translateY(12px) scale(0.96);
}
to { transform: none;
}
}

/* ---- Head ---- */
.ai-assistant .ai-panel-head {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--cp-hairline);
  background:
    radial-gradient(120% 80% at 10% -20%, oklch(70% 0.18 42 / 0.14), transparent 60%),
    linear-gradient(180deg, var(--cp-raised), var(--cp-card));
  color: var(--cp-text);
}
.ai-panel-head-copy {
  min-width: 0;
}
.ai-assistant .ai-panel-head .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  color: var(--color-ember-strong);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
body[data-scene="admin"] .ai-assistant .ai-panel-head .eyebrow {
  color: var(--color-ember-soft);
}
.ai-assistant .ai-panel-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variation-settings: "opsz" 24;
  color: var(--cp-text);
}
.ai-assistant .ai-panel-head span {
  display: block;
  margin-top: 4px;
  color: var(--cp-text-sec);
  font-size: 12.5px;
  line-height: 1.5;
}
.ai-session-id {
  padding: 2px 7px;
  border: 1px solid var(--cp-hairline-strong);
  border-radius: var(--radius-xs);
  background: var(--cp-inset);
  color: var(--cp-text-sec);
  font-size: 10px;
  letter-spacing: 0.02em;
  text-transform: none;
}
.ai-status-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cp-text-mu);
  box-shadow: 0 0 0 0 oklch(60% 0.014 80 / 0);
}
.ai-status-dot[data-state="live"] {
  background: var(--color-moss);
  animation: ai-status-pulse 1.4s ease-out infinite;
}
@keyframes ai-status-pulse {
0% { box-shadow: 0 0 0 0 oklch(54% 0.10 145 / 0.45);
}
100% { box-shadow: 0 0 0 8px oklch(54% 0.10 145 / 0);
}
}
.ai-assistant .ai-panel-tools {
  display: inline-flex;
  gap: 6px;
}
.ai-assistant .ai-panel-head button {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--cp-hairline);
  border-radius: var(--radius-sm);
  background: var(--cp-inset);
  color: var(--cp-text-sec);
  transition: background var(--dur-fast) var(--ease-out-expo), color var(--dur-fast) var(--ease-out-expo);
}
.ai-assistant .ai-panel-head button:hover {
  background: oklch(70% 0.18 42 / 0.12);
  color: var(--color-ember-strong);
}

/* ---- Thread ---- */
.ai-assistant .ai-thread {
  display: grid;
  gap: 18px;
  max-height: none;
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 20px 18px;
  background: var(--cp-card);
  scrollbar-width: thin;
  scrollbar-color: var(--cp-hairline-strong) transparent;
}
.ai-assistant .ai-thread::-webkit-scrollbar { width: 6px;
}
.ai-assistant .ai-thread::-webkit-scrollbar-thumb { background: var(--cp-hairline-strong); border-radius: 999px;
}
.ai-assistant .ai-message {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 12px;
  align-items: flex-start;
}
.ai-assistant .ai-message.user {
  grid-template-columns: minmax(0, 1fr) 32px;
}
.ai-assistant .ai-message.user .ai-avatar { order: 2;
}
.ai-assistant .ai-message.user .ai-bubble { order: 1; text-align: left;
}
.ai-assistant .ai-avatar {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: oklch(70% 0.18 42 / 0.10);
  color: var(--color-ember-strong);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
}
body[data-scene="admin"] .ai-assistant .ai-avatar {
  background: oklch(100% 0 0 / 0.06);
  color: var(--color-ember-soft);
}
.ai-assistant .ai-message.user .ai-avatar {
  background: linear-gradient(135deg, var(--color-ember), var(--color-ember-strong));
  color: oklch(99% 0.01 70);
}
.ai-assistant .ai-bubble {
  position: relative;
  min-width: 0;
  padding: 12px 14px;
  border: 1px solid var(--cp-hairline);
  border-radius: 14px;
  background: var(--cp-raised);
  color: var(--cp-text);
  font-size: 14px;
  line-height: 1.62;
  box-shadow: none;
}
.ai-assistant .ai-message.user .ai-bubble {
  background: linear-gradient(135deg, oklch(70% 0.18 42 / 0.14), oklch(70% 0.18 42 / 0.04));
  border-color: oklch(70% 0.18 42 / 0.3);
  color: var(--cp-text);
}
.ai-assistant .ai-bubble p {
  margin: 0;
  text-wrap: pretty;
}
.ai-text {
  white-space: pre-wrap;
  word-break: break-word;
}

/* Streaming cursor */
.ai-cursor {
  display: inline-block;
  width: 0.55em;
  height: 1em;
  margin-left: 3px;
  vertical-align: -2px;
  border-radius: 1px;
  background: var(--color-ember);
  animation: ai-cursor-blink 0.92s steps(1, end) infinite;
}
@keyframes ai-cursor-blink {
0%, 49% { opacity: 1;
}
50%, 100% { opacity: 0;
}
}

/* ---- Agent Trace + Tool Timeline ---- */
.ai-assistant .ai-agent-trace {
  margin-top: 12px;
  padding-top: 12px;
  padding-left: 0;
  border-left: 0;
  border-top: 1px dashed var(--cp-hairline-strong);
}
.ai-assistant .ai-agent-trace > small {
  display: inline-block;
  margin-bottom: 10px;
  padding: 2px 8px;
  border: 1px solid var(--cp-hairline);
  border-radius: var(--radius-xs);
  background: var(--cp-inset);
  color: var(--cp-text-mu);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
}
.ai-tool-timeline {
  position: relative;
  list-style: none;
  margin: 0;
  padding: 0 0 0 12px;
}
.ai-tool-timeline::before {
  content: "";
  position: absolute;
  top: 12px;
  bottom: 12px;
  left: 6px;
  width: 1px;
  background: linear-gradient(180deg, var(--cp-hairline-strong), var(--cp-hairline));
}
.ai-tool-step {
  position: relative;
  margin: 0 0 8px;
}
.ai-tool-step:last-child { margin-bottom: 0;
}
.ai-tool-step-head {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  gap: 10px;
  width: 100%;
  align-items: center;
  padding: 7px 10px 7px 0;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background var(--dur-fast) var(--ease-out-expo);
}
.ai-tool-step-head:hover {
  background: var(--cp-inset);
}
.ai-tool-rail {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-left: -18px;
  border-radius: 50%;
  background: var(--cp-card);
  box-shadow: 0 0 0 3px var(--cp-raised);
}
.ai-tool-step[data-status="running"] .ai-tool-rail { color: var(--color-ember-strong);
}
.ai-tool-step[data-status="done"] .ai-tool-rail { color: var(--color-moss);
}
.ai-tool-step[data-status="error"] .ai-tool-rail { color: var(--color-danger);
}
.ai-tool-meta {
  display: grid;
  gap: 1px;
  min-width: 0;
  text-align: left;
}
.ai-tool-meta strong {
  display: block;
  color: var(--cp-text);
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ai-tool-meta small {
  color: var(--cp-text-mu);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ai-tool-chev {
  color: var(--cp-text-mu);
  transition: transform var(--dur-fast) var(--ease-out-expo);
}
.ai-tool-step[data-expanded="true"] .ai-tool-chev {
  transform: rotate(90deg);
  color: var(--color-ember-strong);
}
.ai-tool-payload {
  display: grid;
  gap: 8px;
  margin: 6px 0 6px 4px;
  padding: 10px 12px;
  border: 1px solid var(--cp-hairline);
  border-radius: var(--radius-sm);
  background: var(--cp-payload);
}
.ai-tool-payload-block { display: grid; gap: 4px;
}
.ai-tool-tag {
  display: inline-block;
  align-self: flex-start;
  padding: 2px 7px;
  border-radius: var(--radius-xs);
  background: oklch(70% 0.18 42 / 0.18);
  color: var(--color-ember-strong);
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.ai-tool-tag[data-variant="result"] {
  background: oklch(54% 0.10 145 / 0.18);
  color: oklch(40% 0.10 145);
}
body[data-scene="admin"] .ai-tool-tag[data-variant="result"] {
  background: oklch(82% 0.16 142 / 0.16);
  color: oklch(82% 0.16 142);
}
.ai-tool-payload pre {
  margin: 0;
  max-height: 220px;
  overflow: auto;
  color: var(--cp-text-sec);
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-all;
}

/* Override legacy .ai-tool-card from styles.css (we replaced it) */
.ai-assistant .ai-tool-card { display: none;
}

/* ---- Shop result cards ---- */
.ai-assistant .ai-shop-results {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}
.ai-assistant .ai-shop-card {
  display: grid;
  gap: 6px;
  padding: 12px;
  border: 1px solid var(--cp-hairline);
  border-radius: var(--radius-sm);
  background: var(--cp-inset);
  color: var(--cp-text);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out-expo), background var(--dur-fast) var(--ease-out-expo);
}
.ai-assistant .ai-shop-card:hover {
  border-color: oklch(70% 0.18 42 / 0.35);
  background: oklch(70% 0.18 42 / 0.06);
}
.ai-assistant .ai-shop-card strong {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--cp-text);
}
.ai-assistant .ai-shop-card small,
.ai-assistant .ai-shop-card em,
.ai-assistant .ai-shop-card i {
  color: var(--cp-text-mu);
  font-style: normal;
  font-size: 11.5px;
}
.ai-assistant .ai-shop-card em {
  color: var(--color-ember-strong);
  font-family: var(--font-mono);
  font-size: 11px;
}
.ai-assistant .ai-shop-meta {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 10px;
  font-family: var(--font-mono);
  font-feature-settings: "tnum";
}
.ai-assistant .ai-voucher-tags {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 2px;
}
.ai-assistant .ai-voucher-tags b {
  padding: 2px 7px;
  border-radius: var(--radius-xs);
  background: oklch(70% 0.18 42 / 0.16);
  color: var(--color-ember-strong);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
}

/* ---- Quick prompts (pill chips) ---- */
.ai-assistant .ai-quick-prompts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 18px;
  border-top: 1px solid var(--cp-hairline);
  background: var(--cp-card);
}
.ai-assistant .ai-quick-prompts button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid var(--cp-hairline-strong);
  border-radius: var(--radius-pill);
  background: var(--cp-inset);
  color: var(--cp-text-sec);
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out-expo), border-color var(--dur-fast) var(--ease-out-expo);
}
.ai-assistant .ai-quick-prompts button:hover {
  background: oklch(70% 0.18 42 / 0.12);
  border-color: oklch(70% 0.18 42 / 0.4);
  color: var(--color-ember-strong);
}

/* ---- Action buttons inside messages ---- */
.ai-assistant .ai-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.ai-assistant .ai-actions button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid oklch(70% 0.18 42 / 0.34);
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, oklch(70% 0.18 42 / 0.14), oklch(70% 0.18 42 / 0.04));
  color: var(--color-ember-strong);
  font-family: var(--font-sans);

  gap: 24px;
  align-items: end;
  padding: 26px;
  border-radius: 8px;
  background:
    linear-gradient(135deg, rgba(220, 239, 230, 0.1), transparent 44%),
    #18221f;
  color: #fffdf9;
  box-shadow: 0 18px 45px rgba(24, 34, 31, 0.2);
}

.geo-admin-header h1,
.geo-inspector-head h2 {
  margin: 0;
}

.geo-admin-header h1 {
  font-size: 42px;
  line-height: 1.05;
}

.geo-admin-header p:last-child {
  max-width: 640px;
  margin: 12px 0 0;
  color: #d5e4dc;
  line-height: 1.65;
}

.geo-admin-header .eyebrow {
  color: #ffb28f;
}

.geo-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.geo-stats span,
.geo-meta-grid span {
  display: grid;
  gap: 4px;
}

.geo-stats span {
  min-height: 82px;
  align-content: center;
  border: 1px solid rgba(220, 239, 230, 0.22);
  border-radius: 8px;
  padding: 12px;
  background: rgba(255, 253, 249, 0.08);
  color: #c6d7cf;
}

.geo-stats strong {
  color: #fffdf9;
  font-size: 28px;
  line-height: 1;
}

.ops-summary {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.ops-summary article {
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
}

.ops-summary strong,
.ops-summary span,
.ops-summary small {
  display: block;
}

.ops-summary strong {
  color: var(--ink);
  font-size: 24px;
  line-height: 1;
}

.ops-summary span {
  margin-top: 7px;
  font-weight: 700;
}

.ops-summary small {
  margin-top: 4px;
  color: var(--muted);
}

.geo-notice {
  margin-bottom: 0;
}

.geo-command-bar,
.geo-search,
.geo-panel-head,
.geo-inline-actions,
.geo-poi-search {
  display: flex;
  align-items: center;
}

.geo-command-bar {
  justify-content: space-between;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
}

.geo-amap-health {
  display: grid;
  grid-template-columns: minmax(220px, 0.7fr) minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  border: 1px solid #cfe2d7;
  border-radius: 8px;
  padding: 12px;
  background: #f5fbf7;
}

.geo-amap-health.degraded {
  border-color: #f1c8b8;
  background: #fff5ef;
}

.geo-amap-title,
.geo-amap-metrics {
  display: flex;
  align-items: center;
}

.geo-amap-title {
  min-width: 0;
  gap: 10px;
}

.geo-amap-title strong,
.geo-amap-title span,
.geo-amap-metrics small {
  display: block;
}

.geo-amap-title span,
.geo-amap-metrics small {
  color: var(--muted);
}

.geo-amap-title span {
  margin-top: 3px;
  font-size: 13px;
}

.geo-amap-metrics {
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.geo-amap-metrics span {
  min-width: 92px;
  border: 1px solid rgba(35, 31, 32, 0.08);
  border-radius: 8px;
  padding: 8px 10px;
  background: #fff;
  color: var(--ink);
  font-weight: 800;
}

.geo-amap-metrics small {
  margin-bottom: 2px;
  font-size: 11px;
  font-weight: 700;
}

.geo-batch-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  background: #f8fcf9;
}

.geo-batch-copy,
.geo-batch-controls,
.geo-check {
  display: flex;
  align-items: center;
}

.geo-batch-copy {
  min-width: 0;
  gap: 10px;
}

.geo-batch-copy strong,
.geo-batch-copy span {
  display: block;
}

.geo-batch-copy span {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.geo-batch-controls {
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px;
}

.batch-limit {
  width: 82px;
}

.geo-check {
  min-height: 42px;
  gap: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.geo-check input {
  width: 16px;
  height: 16px;
  accent-color: var(--brand);
}

.geo-batch-status {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 160px minmax(0, 1fr) minmax(180px, 0.8fr) auto;
  gap: 12px;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}

.geo-batch-status span,
.geo-batch-status strong,
.geo-batch-status small {
  display: block;
}

.geo-batch-status span {
  color: var(--brand-dark);
  font-size: 12px;
  font-weight: 800;
}

.geo-batch-status strong {
  color: var(--ink);
  font-size: 20px;
}

.geo-batch-status small,
.geo-batch-status p {
  color: var(--muted);
}

.geo-batch-status p {
  margin: 0;
  line-height: 1.45;
}

.geo-progress-track {
  overflow: hidden;
  height: 10px;
  border-radius: 999px;
  background: #e5f1eb;
}

.geo-progress-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--brand);
  transition: width 0.24s ease;
}

.geo-batch-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

.geo-mini-text-button {
  display: inline-flex;
  min-height: 32px;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 0;
  border-radius: 8px;
  padding: 0 9px;
  background: #f4ece4;
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.geo-mini-text-button:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}

.geo-batch-items {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.geo-batch-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
  background: #fff;
}

.geo-batch-item strong,
.geo-batch-item span {
  display: block;
}

.geo-batch-item strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.geo-batch-item span {
  overflow: hidden;
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.geo-batch-item small {
  display: inline-flex;
  min-height: 24px;
  align-items: center;
  border-radius: 999px;
  padding: 0 8px;
  background: #f4ece4;
  color: var(--muted);
  font-weight: 800;
}

.geo-batch-item .batch-success {
  background: #dcefe6;
  color: #1e6a4d;
}

.geo-batch-item .batch-failed {
  background: #ffe5db;
  color: #842a14;
}

.geo-batch-item .batch-running {
  background: #fff0bf;
  color: #805a00;
}

.geo-batch-item .batch-canceled {
  background: #f4ece4;
  color: var(--muted);
}

.geo-job-history {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.geo-job-row {
  min-width: 0;
}

.geo-job-row button {
  display: block;
  width: 100%;
  min-height: 58px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
  background: #fff;
  color: var(--ink);
  text-align: left;
}

.geo-job-row.active button,
.geo-job-row button:hover {
  border-color: rgba(245, 95, 45, 0.62);
  box-shadow: 0 8px 18px rgba(77, 51, 36, 0.08);
}

.geo-job-row strong,
.geo-job-row span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.geo-job-row span {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.geo-search,
.geo-poi-search {
  min-width: 0;
  flex: 1;
  gap: 10px;
}

.compact-field {
  display: grid;
  min-width: 0;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.compact-field input,
.compact-field select {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: 0;
  padding: 0 11px;
  background: #fff;
  color: var(--ink);
  font-weight: 500;
}

.compact-field input:focus,
.compact-field select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(245, 95, 45, 0.12);
}

.geo-search .compact-field:first-child {
  width: 120px;
  flex: 0 0 120px;
}

.geo-search .compact-field:nth-child(2),
.geo-poi-search .compact-field {
  flex: 1;
}

.geo-icon-button {
  display: inline-flex;
  min-height: 42px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  border-radius: 8px;
  padding: 0 13px;
  background: #e5f1eb;
  color: #173128;
  white-space: nowrap;
}

.geo-icon-button.primary {
  background: var(--ink);
  color: #fff;
}

.geo-icon-button.wide {
  width: 100%;
}

.geo-icon-button:disabled,
.geo-row-actions button:disabled,
.geo-candidate-row button:disabled {
  cursor: not-allowed;
  opacity: 0.58;
}

.geo-workbench {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(380px, 0.58fr);
  gap: 16px;
  align-items: start;
}

.geo-shop-panel,
.geo-inspector {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 253, 249, 0.82);
}

.geo-shop-panel {
  padding: 14px;
}

.geo-inspector {
  position: sticky;
  top: 88px;
  display: grid;
  gap: 14px;
  padding: 16px;
}

.geo-panel-head {
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.geo-panel-head .section-heading {
  margin-bottom: 0;
}

.geo-panel-subtitle {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.geo-segmented {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.geo-segmented button {
  min-height: 34px;
  border: 0;
  border-radius: 8px;
  padding: 0 10px;
  background: #f4ece4;
  color: var(--muted);
}

.geo-segmented button.active {
  background: var(--ink);
  color: #fff;
}

.geo-shop-list {
  display: grid;
  gap: 8px;
}

.geo-shop-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 88px 178px 108px;
  gap: 10px;
  align-items: center;
  min-height: 78px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #fff;
  cursor: pointer;
}

.geo-shop-row:hover,
.geo-shop-row.selected {
  border-color: rgba(245, 95, 45, 0.68);
  box-shadow: 0 10px 24px rgba(77, 51, 36, 0.08);
}

.geo-shop-main {
  min-width: 0;
}

.geo-shop-main strong,
.geo-shop-main span,
.geo-candidate-row strong,
.geo-candidate-row span,
.geo-candidate-row small,
.geo-inspector-head span,
.geo-meta-grid small {
  display: block;
}

.geo-shop-main strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.geo-shop-main span,
.geo-coordinate,
.geo-candidate-row span,
.geo-candidate-row small,
.geo-inspector-head span,
.geo-meta-grid {
  color: var(--muted);
}

.geo-shop-main span {
  overflow: hidden;
  margin-top: 4px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.geo-status-pill {
  display: inline-flex;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 0 9px;
  background: #f4ece4;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.geo-status-verified {
  background: #dcefe6;
  color: #1e6a4d;
}

.geo-status-pending {
  background: #fff0bf;
  color: #805a00;
}

.geo-status-missing {
  background: #ffe5db;
  color: #842a14;
}

.geo-coordinate {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.geo-row-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

.geo-row-actions button,
.geo-row-actions a {
  display: inline-flex;
  width: 32px;
  height: 32px;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 8px;
  background: #f4ece4;
  color: var(--ink);
}

.geo-inspector-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 12px;
}

.geo-inspector-head h2 {
  font-size: 24px;
  line-height: 1.18;
}

.geo-meta-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.geo-meta-grid span {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #fff;
  overflow-wrap: anywhere;
}

.geo-meta-grid small {
  color: #9a8d84;
  font-size: 11px;
  font-weight: 800;
}

.geo-tool-band,
.geo-manual-form {
  display: grid;
  gap: 10px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.geo-inline-actions {
  flex-wrap: wrap;
  gap: 8px;
}

.geo-inline-error {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  color: #842a14;
  font-size: 13px;
}

.geo-candidate-list {
  display: grid;
  gap: 8px;
  max-height: 340px;
  overflow: auto;
  padding-right: 2px;
}

.geo-candidate-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #fff;
  cursor: pointer;
}

.geo-candidate-row:hover {
  border-color: rgba(30, 106, 77, 0.45);
  background: #f8fcf9;
}

.geo-candidate-row span {
  margin: 4px 0;
  line-height: 1.45;
}

.geo-candidate-row button {
  display: inline-flex;
  min-height: 36px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  border-radius: 8px;
  padding: 0 11px;
  background: var(--brand);
  color: #fff;
}

.geo-manual-form {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.geo-manual-form .geo-panel-head,
.geo-manual-form .wide {
  grid-column: 1 / -1;
}

.geo-audit-panel {
  display: grid;
  gap: 10px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.geo-mini-button {
  display: inline-flex;
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 8px;
  background: #f4ece4;
  color: var(--ink);
}

.geo-mini-actions {
  display: flex;
  flex: 0 0 auto;
  gap: 6px;
}

.geo-audit-list {
  display: grid;
  gap: 8px;
}

.geo-audit-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #fff;
}

.geo-audit-row strong,
.geo-audit-row span {
  display: block;
}

.geo-audit-row strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.geo-audit-row span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.geo-audit-row small {
  display: inline-flex;
  min-height: 26px;
  align-items: center;
  border-radius: 999px;
  padding: 0 8px;
  background: #dcefe6;
  color: #1e6a4d;
  font-weight: 800;
  white-space: nowrap;
}

.geo-audit-row small.failed {
  max-width: 160px;
  overflow: hidden;
  background: #ffe5db;
  color: #842a14;
  text-overflow: ellipsis;
}

.geo-inspector-empty {
  display: grid;
  min-height: 420px;
  place-content: center;
  justify-items: center;
  gap: 10px;
  text-align: center;
  color: var(--muted);
}

.geo-inspector-empty strong {
  color: var(--ink);
  font-size: 20px;
}

.geo-inspector-empty span {
  max-width: 300px;
  line-height: 1.6;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes shimmer {
  to {
    background-position-x: -220%;
  }
}

@media (max-width: 860px) {
  .app-shell {
    width: min(100% - 20px, 680px);
  }

  .topbar {
    grid-template-columns: 1fr auto;
  }

  .search-box {
    grid-column: 1 / -1;
    grid-row: 2;
  }

  .top-actions {
    grid-column: 1 / -1;
    grid-row: 3;
  }

  .top-actions a,
  .admin-menu,
  .admin-menu summary {
    flex: 1;
  }

  .admin-menu-popover {
    left: 0;
    right: auto;
  }

  .hero-panel,
  .content-grid,
  .auth-layout,
  .shop-detail,
  .blog-detail,
  .compose-layout,
  .geo-admin-header,
  .geo-workbench {
    grid-template-columns: 1fr;
  }

  .geo-inspector {
    position: static;
  }

  .geo-command-bar,
  .geo-search,
  .geo-batch-panel,
  .geo-amap-health {
    align-items: stretch;
  }

  .geo-command-bar,
  .geo-search,
  .geo-batch-panel {
    flex-direction: column;
  }

  .geo-amap-health {
    grid-template-columns: 1fr;
  }

  .geo-amap-metrics {
    justify-content: flex-start;
  }

  .geo-batch-panel,
  .geo-batch-status,
  .geo-batch-items,
  .geo-job-history {
    grid-template-columns: 1fr;
  }

  .geo-batch-controls {
    justify-content: flex-start;
  }

  .geo-search .compact-field:first-child {
    width: 100%;
    flex-basis: auto;
  }

  .geo-stats,
  .ops-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .hero-panel {
    padding: 24px;
  }

  .hero-copy h1,
  .auth-art h1,
  .detail-body h1,
  .orders-header h1,
  .blog-detail-body h1,
  .compose-intro h1,
  .not-found-page h1,
  .ops-command-copy h1 {
    font-size: 40px;
  }

  .list-hero h1,
  .geo-admin-header h1 {
    font-size: 36px;
  }

  .hero-metric {
    justify-self: stretch;
    width: auto;
  }

  .auth-art {
    min-height: 320px;
  }

  .shop-row {
    grid-template-columns: 130px minmax(0, 1fr);
  }

  .shop-distance {
    display: none;
  }

  .order-card {
    grid-template-columns: 1fr;
    align-items: stretch;
  }

  .order-side {
    justify-items: start;
    min-width: 0;
  }

  .admin-order-search {
    grid-template-columns: 1fr;
  }

  .admin-order-audit-list article {
    grid-template-columns: 1fr;
  }

  .admin-shops-layout,
  .admin-shop-grid,
  .admin-voucher-search,
  .admin-dashboard-kpis,
  .admin-dashboard-grid,
  .admin-dashboard-risks,
  .admin-api-table article,
  .admin-api-permissions article,
  .admin-audit-filters,
  .admin-audit-status,
  .admin-audit-list article,
  .admin-user-search,
  .admin-user-row,
  .admin-blog-row {
    grid-template-columns: 1fr;
  }

  .admin-blog-row img {
    width: 100%;
    height: 180px;
  }

  .admin-user-role {
    justify-content: flex-start;
  }

  .detail-cover {
    min-height: 320px;
  }
}

@media (max-width: 620px) {
  .ai-assistant {
    right: 12px;
    bottom: 12px;
  }

  .ai-panel {
    right: -2px;
    bottom: 58px;
    width: calc(100vw - 20px);
    max-height: calc(100vh - 82px);
  }

  .ai-thread {
    max-height: calc(100vh - 300px);
  }

  .blog-grid,
  .feed-skeleton {
    grid-template-columns: 1fr;
  }

  .category-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .hero-copy h1,
  .auth-art h1,
  .detail-body h1,
  .orders-header h1,
  .blog-detail-body h1,
  .compose-intro h1,
  .not-found-page h1,
  .ops-command-copy h1 {
    font-size: 34px;
  }

  .list-hero h1,
  .geo-admin-header h1 {
    font-size: 32px;
  }

  .shop-row {
    grid-template-columns: 1fr;
  }

  .shop-row-cover {
    height: 210px;
  }

  .shop-row-head {
    display: block;
  }

  .voucher-card {
    grid-template-columns: 1fr;
  }

  .orders-header,
  .order-title-row {
    align-items: stretch;
    flex-direction: column;
  }

  .order-main {
    grid-template-columns: 1fr;
  }

  .notice-link {
    margin-left: 0;
  }

  .geo-shop-row,
  .geo-candidate-row,
  .geo-manual-form,
  .geo-meta-grid {
    grid-template-columns: 1fr;
  }

  .geo-row-actions {
    justify-content: flex-start;
  }

  .geo-panel-head,
  .geo-poi-search,
  .geo-inline-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .geo-stats {
    grid-template-columns: 1fr;
  }

  .ops-summary {
    grid-template-columns: 1fr;
  }

  .voucher-price {
    text-align: left;
  }

  .brand-lockup {
    min-width: 0;
  }

  .brand-lockup span {
    display: none;
  }
}

/* 2026 refactor layer: CityCopilot moves from a single demo shell to a city/ops product system. */
:root {
  color: #151a17;
  background: #f3f1ea;
  font-family: "DIN Alternate", "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
  --paper: #fffdf7;
  --paper-strong: #ffffff;
  --ink: #151a17;
  --muted: #6f736b;
  --line: #ded7c9;
  --brand: #e9552f;
  --brand-dark: #9f321d;
  --signal: #157f5b;
  --amber: #d89518;
  --night: #111816;
  --mint: #dcefe6;
  --sky: #dbeaf5;
  --shadow: 0 20px 54px rgba(38, 34, 28, 0.13);
  --shadow-tight: 0 12px 28px rgba(38, 34, 28, 0.1);
  --radius: 8px;
}

body {
  min-height: 100vh;
  background:
    linear-gradient(90deg, rgba(21, 26, 23, 0.035) 1px, transparent 1px),
    linear-gradient(0deg, rgba(21, 26, 23, 0.028) 1px, transparent 1px),
    linear-gradient(145deg, #f7f3ea 0%, #eef4ed 44%, #f8efe7 100%);
  background-size: 48px 48px, 48px 48px, auto;
  color: var(--ink);
}

body::before {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  content: "";
  background-image:
    linear-gradient(120deg, rgba(233, 85, 47, 0.08), transparent 24%),
    repeating-linear-gradient(135deg, rgba(21, 26, 23, 0.026) 0 1px, transparent 1px 18px);
  opacity: 0.88;
}

.app-shell {
  width: min(1280px, calc(100% - 36px));
  margin: 0 auto;
  padding: 18px 0 44px;
}

.app-shell-auth {
  width: min(1180px, calc(100% - 32px));
}

.app-shell-ops {
  display: grid;
  width: min(1440px, calc(100% - 32px));
  grid-template-columns: 244px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.city-topbar {
  position: sticky;
  top: 14px;
  z-index: 16;
  display: grid;
  grid-template-columns: auto minmax(260px, 1fr) auto auto;
  gap: 10px;
  align-items: center;
  padding: 10px;
  border: 1px solid rgba(222, 215, 201, 0.84);
  border-radius: var(--radius);
  background: rgba(255, 253, 247, 0.82);
  backdrop-filter: blur(22px);
  box-shadow: var(--shadow-tight);
}

.brand-lockup {
  min-width: 180px;
}

.brand-mark {
  position: relative;
  overflow: hidden;
  background: var(--night);
}

.brand-mark::after {
  position: absolute;
  inset: auto 7px 7px auto;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--signal);
  content: "";
}

.brand-lockup strong {
  font-size: 15px;
}

.brand-lockup span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.search-box {
  border-color: rgba(21, 26, 23, 0.1);
  background: rgba(255, 255, 255, 0.86);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
}

.search-submit,
.auth-button,
.location-toggle,
.load-more {
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}

.search-submit:hover,
.auth-button:hover,
.location-toggle:hover,
.load-more:hover {
  transform: translateY(-1px);
}

.top-actions a,
.auth-button {
  min-height: 40px;
  border: 1px solid rgba(21, 26, 23, 0.08);
  background: rgba(255, 255, 255, 0.68);
}

.top-actions a.router-link-active,
.top-actions a:hover {
  background: #18221f;
  color: #fffdf9;
}

.auth-button {
  background: #e9f3ec;
  color: #14372a;
  font-weight: 800;
}

.ops-rail,
.ops-main,
.home-command,
.home-live-panel,
.city-filter-panel,
.city-feed-panel,
.home-ops-strip article {
  border: 1px solid rgba(222, 215, 201, 0.84);
  border-radius: var(--radius);
}

.ops-rail {
  position: sticky;
  top: 16px;
  display: grid;
  min-height: calc(100vh - 32px);
  grid-template-rows: auto 1fr auto;
  gap: 18px;
  padding: 14px;
  background:
    linear-gradient(180deg, rgba(255, 253, 247, 0.94), rgba(242, 247, 241, 0.9)),
    repeating-linear-gradient(135deg, rgba(21, 26, 23, 0.03) 0 1px, transparent 1px 16px);
  box-shadow: var(--shadow-tight);
}

.ops-brand {
  min-width: 0;
  padding: 4px;
}

.ops-nav {
  display: grid;
  align-content: start;
  gap: 7px;
}

.ops-nav a {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 9px;
  align-items: center;
  min-height: 54px;
  border-radius: var(--radius);
  padding: 8px;
  color: var(--muted);
}

.ops-nav a svg {
  justify-self: center;
  color: currentColor;
}

.ops-nav a strong,
.ops-nav a small {
  display: block;
}

.ops-nav a strong {
  color: var(--ink);
  font-size: 14px;
}

.ops-nav a small {
  margin-top: 2px;
  font-size: 11px;
}

.ops-nav a.router-link-active,
.ops-nav a:hover {
  background: #15201d;
  color: #dcefe6;
}

.ops-nav a.router-link-active strong,
.ops-nav a:hover strong {
  color: #fffdf9;
}

.ops-rail-footer {
  display: grid;
  gap: 8px;
}

.ops-rail-footer a,
.ops-rail-footer button,
.ops-topbar-actions a {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  border-radius: var(--radius);
  padding: 0 11px;
  background: #f4eee3;
  color: var(--ink);
  font-weight: 800;
}

.ops-rail-footer button {
  justify-content: flex-start;
  background: #18221f;
  color: #fffdf9;
}

.ops-main {
  min-width: 0;
  padding: 14px;
  background: rgba(255, 253, 247, 0.68);
  box-shadow: var(--shadow-tight);
}

.ops-topbar {
  position: sticky;
  top: 16px;
  z-index: 12;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  border: 1px solid rgba(222, 215, 201, 0.84);
  border-radius: var(--radius);
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(18px);
}

.ops-topbar span,
.ops-topbar strong {
  display: block;
}

.ops-topbar span {
  color: var(--brand-dark);
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.ops-topbar strong {
  margin-top: 2px;
  font-size: 18px;
}

.ops-topbar-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.ops-topbar-actions a {
  background: #e8f2ec;
  color: #14372a;
}

.home-command {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 0.58fr);
  gap: 22px;
  overflow: hidden;
  margin: 18px 0;
  padding: clamp(24px, 4vw, 42px);
  background:
    linear-gradient(110deg, rgba(17, 24, 22, 0.98), rgba(23, 41, 35, 0.92) 54%, rgba(54, 77, 62, 0.82)),
    repeating-linear-gradient(90deg, rgba(255, 253, 247, 0.08) 0 1px, transparent 1px 46px);
  color: #fffdf7;
  box-shadow: var(--shadow);
}

.home-command::before {
  position: absolute;
  inset: 0;
  pointer-events: none;
  content: "";
  background:
    linear-gradient(90deg, rgba(255, 253, 247, 0.07) 1px, transparent 1px),
    linear-gradient(0deg, rgba(255, 253, 247, 0.055) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
}

.home-command-copy,
.home-live-panel {
  position: relative;
  z-index: 1;
}

.home-command-copy {
  display: grid;
  align-content: center;
  gap: 18px;
}

.home-command .eyebrow {
  color: #ffb391;
}

.home-command h1 {
  max-width: 760px;
  margin: 0;
  font-size: 58px;
  line-height: 1.02;
  text-wrap: balance;
}

.home-command h1 span {
  display: block;
}

.home-command p {
  max-width: 680px;
  margin: 0;
  color: #dfe7df;
  font-size: 17px;
  line-height: 1.75;
}

.home-command-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.home-command-actions a {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius);
  padding: 0 15px;
  background: #fffdf7;
  color: var(--ink);
  font-weight: 900;
}

.home-command-actions a + a {
  background: rgba(255, 253, 247, 0.12);
  color: #fffdf7;
  box-shadow: inset 0 0 0 1px rgba(255, 253, 247, 0.22);
}

.home-live-panel {
  display: grid;
  gap: 14px;
  align-self: stretch;
  padding: 14px;
  background: rgba(255, 253, 247, 0.1);
  backdrop-filter: blur(16px);
  border-color: rgba(255, 253, 247, 0.18);
}

.home-live-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 10px;
}

.home-live-head span,
.home-live-head strong {
  display: block;
}

.home-live-head span {
  color: #b8cbbd;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.home-live-head strong {
  font-size: 30px;
}

.home-signal-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.home-signal-grid article {
  min-width: 0;
  border: 1px solid rgba(255, 253, 247, 0.16);
  border-radius: var(--radius);
  padding: 11px;
  background: rgba(255, 253, 247, 0.1);
}

.home-signal-grid svg,
.home-signal-grid span,
.home-signal-grid strong,
.home-signal-grid small {
  display: block;
}

.home-signal-grid svg {
  color: #a7f0c5;
}

.home-signal-grid span {
  margin-top: 10px;
  color: #c5d7ca;
  font-size: 11px;
  font-weight: 800;
}

.home-signal-grid strong {
  margin-top: 4px;
  color: #fffdf7;
  font-size: 24px;
}

.home-signal-grid small {
  margin-top: 4px;
  color: #b4c5b9;
  line-height: 1.35;
}

.home-lead-note {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  border-radius: var(--radius);
  padding: 8px;
  background: #fffdf7;
  color: var(--ink);
}

.home-lead-note img {
  width: 96px;
  height: 76px;
  border-radius: var(--radius);
  object-fit: cover;
  background: var(--mint);
}

.home-lead-note small,
.home-lead-note strong {
  display: block;
}

.home-lead-note small {
  color: var(--brand-dark);
  font-size: 11px;
  font-weight: 900;
}

.home-lead-note strong {
  display: -webkit-box;
  overflow: hidden;
  margin-top: 4px;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-height: 1.35;
}

.home-flow {
  display: grid;
  grid-template-columns: minmax(250px, 0.38fr) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}

.city-filter-panel,
.city-feed-panel {
  min-width: 0;
  padding: 16px;
  background: rgba(255, 253, 247, 0.82);
  box-shadow: var(--shadow-tight);
}

.city-filter-panel {
  position: sticky;
  top: 94px;
}

.section-copy {
  margin: -4px 0 14px;
  color: var(--muted);
  line-height: 1.6;
}

.category-grid {
  gap: 9px;
}

.category-item {
  min-height: 92px;
  border: 1px solid rgba(21, 26, 23, 0.08);
  background: #fff;
  box-shadow: none;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}

.category-item:hover {
  border-color: rgba(233, 85, 47, 0.54);
  box-shadow: 0 12px 26px rgba(38, 34, 28, 0.1);
}

.blog-grid {
  gap: 14px;
}

.city-note-card {
  border: 1px solid rgba(21, 26, 23, 0.08);
  background: #fff;
  box-shadow: var(--shadow-tight);
}

.city-note-card .blog-body h3 {
  min-height: 0;
}

.note-signal {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 8px;
  border-radius: 999px;
  padding: 4px 8px;
  background: #e8f2ec;
  color: #146143;
  font-size: 12px;
  font-weight: 900;
}

.home-ops-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 18px;
}

.home-ops-strip article {
  display: grid;
  gap: 8px;
  min-width: 0;
  padding: 15px;
  background: rgba(255, 253, 247, 0.78);
  box-shadow: var(--shadow-tight);
}

.home-ops-strip svg {
  color: var(--brand-dark);
}

.home-ops-strip strong,
.home-ops-strip span {
  display: block;
}

.home-ops-strip span {
  color: var(--muted);
  line-height: 1.55;
}

@media (max-width: 1040px) {
  .city-topbar {
    grid-template-columns: 1fr auto;
  }

  .city-topbar .search-box,
  .city-topbar .top-actions {
    grid-column: 1 / -1;
  }

  .city-topbar .top-actions {
    justify-content: stretch;
  }

  .city-topbar .top-actions a {
    flex: 1;
  }

  .app-shell-ops {
    grid-template-columns: 1fr;
  }

  .ops-rail {
    position: static;
    min-height: 0;
  }

  .ops-nav {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .home-command,
  .home-flow {
    grid-template-columns: 1fr;
  }

  .home-command h1 {
    font-size: 48px;
  }

  .city-filter-panel {
    position: static;
  }
}

@media (max-width: 720px) {
  .app-shell,
  .app-shell-auth,
  .app-shell-ops {
    width: min(100% - 20px, 680px);
    padding-top: 10px;
  }

  .city-topbar {
    top: 8px;
    grid-template-columns: 1fr auto;
  }

  .brand-lockup {
    min-width: 0;
  }

  .home-command {
    padding: 22px;
  }

  .home-command h1 {
    font-size: 38px;
    line-height: 1;
  }

  .home-signal-grid,

@import url("https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap");
/* ============================================================
   CityCopilot · Design Tokens (2026 · Refined Warm Light)
   Light-first consumer surfaces; admin/ops opt-in to dark.
   Loaded AFTER styles.css to win cascade.
   ============================================================ */
:root {
  color-scheme: light dark;

  /* ---- Type stack ---- */
  --font-sans:
    "Geist", "MiSans", "PingFang SC", "HarmonyOS Sans SC",
    "Source Han Sans CN", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: var(--font-sans);
  --font-serif:
    "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --font-mono:
    "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono",
    Menlo, Consolas, "Liberation Mono", monospace;
  --font-feature: "ss01", "cv11", "tnum";

  /* ---- Raw palette (OKLCH for Display P3) ---- */
  /* Warm accents — clay, ember, moss */
  --color-ember: oklch(70% 0.18 42);          /* main accent — warm ember */
  --color-ember-strong: oklch(60% 0.20 38);
  --color-ember-soft: oklch(86% 0.07 55);     /* tint for chips */
  --color-clay: oklch(63% 0.13 50);           /* secondary terracotta */
  --color-moss: oklch(54% 0.10 145);          /* greenery — recommendation, signal-go */
  --color-moss-soft: oklch(88% 0.06 145);
  --color-saffron: oklch(82% 0.16 78);
  --color-signal: var(--color-moss);
  --color-warn: oklch(72% 0.18 70);
  --color-danger: oklch(58% 0.20 28);
  --color-info: oklch(60% 0.10 220);

  /* Warm neutrals — paper */
  --paper-100: oklch(98% 0.018 78);           /* canvas — warm cream */
  --paper-80:  oklch(96% 0.020 75);           /* card */
  --paper-70:  oklch(93% 0.022 72);           /* raised */
  --paper-50:  oklch(86% 0.025 68);           /* hairline */
  --ink-90:    oklch(22% 0.018 60);           /* primary text */
  --ink-70:    oklch(38% 0.016 55);           /* secondary text */
  --ink-50:    oklch(54% 0.014 55);           /* muted */

  /* Cool neutrals — deep forest (ops mode) */
  --forest-100: oklch(13% 0.012 165);
  --forest-90:  oklch(17% 0.014 165);
  --forest-80:  oklch(22% 0.016 165);
  --forest-60:  oklch(34% 0.018 160);

  /* ---- Semantic surfaces (LIGHT default) ---- */
  --surface-canvas: var(--paper-100);
  --surface-card: var(--paper-80);
  --surface-raised: #ffffff;
  --surface-overlay: oklch(98% 0.018 78 / 0.86);
  --surface-glass: oklch(98% 0.018 78 / 0.78);
  --surface-inverse: var(--forest-100);

  --text-primary: var(--ink-90);
  --text-secondary: var(--ink-70);
  --text-muted: var(--ink-50);
  --text-on-accent: var(--paper-100);
  --text-inverse: var(--paper-100);

  --hairline: oklch(22% 0.018 60 / 0.10);
  --hairline-strong: oklch(22% 0.018 60 / 0.22);

  /* ---- Motion ---- */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 140ms;
  --dur: 240ms;
  --dur-slow: 480ms;

  /* ---- Shape ---- */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  /* ---- Elevation (soft, warm) ---- */
  --shadow-tight: 0 1px 0 oklch(100% 0 0 / 0.7), 0 6px 18px oklch(40% 0.04 60 / 0.08);
  --shadow: 0 1px 0 oklch(100% 0 0 / 0.7), 0 20px 56px oklch(40% 0.04 60 / 0.14);
  --shadow-glow: 0 0 0 1px oklch(70% 0.18 42 / 0.3), 0 18px 48px oklch(70% 0.18 42 / 0.18);
}
/* ---- Dark surfaces (admin scene OR explicit dark theme) ---- */
[data-theme="dark"],
body[data-scene="admin"] {
  color-scheme: dark;
  --surface-canvas: var(--forest-100);
  --surface-card: var(--forest-90);
  --surface-raised: var(--forest-80);
  --surface-overlay: oklch(13% 0.012 165 / 0.72);
  --surface-glass: oklch(96% 0.014 80 / 0.06);
  --surface-inverse: var(--paper-100);

  --text-primary: var(--paper-100);
  --text-secondary: oklch(76% 0.014 80);
  --text-muted: oklch(60% 0.014 80);
  --text-on-accent: var(--forest-100);
  --text-inverse: var(--ink-90);

  --hairline: oklch(100% 0 0 / 0.08);
  --hairline-strong: oklch(100% 0 0 / 0.16);

  --shadow-tight: 0 1px 0 oklch(100% 0 0 / 0.04), 0 10px 28px oklch(0% 0 0 / 0.45);
  --shadow: 0 1px 0 oklch(100% 0 0 / 0.04), 0 28px 72px oklch(0% 0 0 / 0.55);
}
/* ---- Base reset (overrides styles.css :root) ---- */
html {
  background: var(--surface-canvas);
  color-scheme: light dark;
  font-family: var(--font-sans);
  font-feature-settings: var(--font-feature);
  font-optical-sizing: auto;
  font-variation-settings: "opsz" auto;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* Warm paper canvas with subtle sunlit gradient */
  background-image:
    radial-gradient(
      120% 60% at 0% 0%,
      oklch(96% 0.030 65) 0%,
      transparent 55%
    ),
    radial-gradient(
      80% 60% at 100% 0%,
      oklch(95% 0.035 80) 0%,
      transparent 55%
    );
  background-attachment: fixed;
}
body[data-scene="admin"] {
  background-image:
    radial-gradient(
      ellipse at top,
      oklch(22% 0.016 165) 0%,
      var(--surface-canvas) 60%
    );
}
body {
  margin: 0;
  min-width: 320px;
  background: transparent;
  font-family: var(--font-sans);
  font-feature-settings: var(--font-feature);
  font-optical-sizing: auto;
  font-variation-settings: "opsz" auto;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
/* Display headings — friendly tracking, optical size aware */
h1, h2, h3 {
  font-family: var(--font-display);
  letter-spacing: -0.02em;
  text-wrap: balance;
  font-variation-settings: "opsz" 32;
}
h1 {
  font-variation-settings: "opsz" 48;
  letter-spacing: -0.03em;
}
p {
  text-wrap: pretty;
}
/* Tabular numerals on data surfaces */
.mono,
.tabular,
code,
kbd,
samp,
pre {
  font-family: var(--font-mono);
  font-feature-settings: "tnum", "ss01", "cv11";
}
/* Selection — ember on paper */
::selection {
  background: var(--color-ember);
  color: var(--text-on-accent);
}
/* Focus ring */
:focus-visible {
  outline: 2px solid var(--color-ember);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}
/* Reduced motion safety net */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
/* ---- Brand-mark refinement (works in both themes) ---- */
.brand-mark {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 14, "wght" 800;
  letter-spacing: -0.04em;
}
/* ---- Eyebrow refinement: uppercase mono micro-label ---- */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
